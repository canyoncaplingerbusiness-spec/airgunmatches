<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Event Review — GunMatches.com</title>

<style>
  :root{
    --navy:#12263f; --navy-2:#1c3557; --steel:#5a6b82;
    --amber:#e08c1b; --amber-dk:#b86f0e;
    --bg:#f5f6f8; --card:#fff; --line:#e2e6ec;
    --text:#1d2733; --muted:#6b7684;
    --green:#1f7a4d; --green-bg:#eaf6ef; --green-line:#b9dfc9;
    --red:#b3261e; --red-bg:#fdecea; --red-line:#f5c2bd;
    --radius:10px; --shadow:0 1px 2px rgba(18,38,63,.06), 0 4px 12px rgba(18,38,63,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px}
  button{font-family:inherit}

  header.site{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;padding:20px 0}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .hrow h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px}
  .hrow .who{font-size:13px;color:#a8b8cd}
  .linkbtn{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;
    padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600}
  .linkbtn:hover{background:rgba(255,255,255,.1)}

  /* ---------- Login ---------- */
  .loginwrap{max-width:380px;margin:70px auto;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:30px}
  .loginwrap h2{margin:0 0 5px;font-size:20px}
  .loginwrap p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
  .loginwrap label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
  .loginwrap input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:15px;margin-bottom:14px;font-family:inherit}
  .loginwrap input:focus{outline:2px solid var(--navy-2);outline-offset:-1px}
  .btn{background:var(--amber);color:#241503;font-weight:700;font-size:15px;border:0;
    padding:11px 20px;border-radius:var(--radius);cursor:pointer;width:100%}
  .btn:hover{background:var(--amber-dk);color:#fff}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:14px}
  .msg.err{background:var(--red-bg);border:1px solid var(--red-line);color:#8f2419}
  .msg.info{background:#eef2f7;border:1px solid #dde4ee;color:var(--navy-2)}

  /* ---------- Login ---------- */
  .loginwrap{max-width:380px;margin:80px auto;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:30px}
  .loginwrap h2{margin:0 0 5px;font-size:20px}
  .loginwrap p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
  .loginwrap label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
  .loginwrap input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:15px;margin-bottom:14px;font-family:inherit}
  .loginwrap input:focus{outline:2px solid var(--navy-2);outline-offset:-1px}
  .loginwrap .btn{width:100%;background:var(--amber);color:#241503;font-weight:700;font-size:15px;
    border:0;padding:11px 20px;border-radius:var(--radius);cursor:pointer}
  .loginwrap .btn:hover{background:var(--amber-dk);color:#fff}
  .loginwrap .btn:disabled{opacity:.6;cursor:default}
  .msg{border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:14px}
  .msg.err{background:var(--red-bg);border:1px solid var(--red-line);color:#8f2419}
  .msg.info{background:#eef2f7;border:1px solid #dde4ee;color:var(--navy-2)}

  /* ---------- Tabs & toolbar ---------- */
  .tabs{display:flex;gap:6px;margin:22px 0 16px;flex-wrap:wrap}
  .tab{background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:14px;
    font-weight:600;padding:9px 15px;border-radius:20px;cursor:pointer}
  .tab:hover{border-color:var(--steel);color:var(--text)}
  .tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .tab .n{font-weight:800;margin-left:5px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .toolbar input{flex:1;min-width:200px;padding:9px 11px;border:1px solid var(--line);
    border-radius:8px;font-size:14.5px;font-family:inherit}
  .toolbar input:focus{outline:2px solid var(--navy-2);outline-offset:-1px}
  .refresh{background:var(--card);border:1px solid var(--line);color:var(--navy-2);font-size:13.5px;
    font-weight:600;padding:9px 14px;border-radius:8px;cursor:pointer}
  .refresh:hover{border-color:var(--steel)}

  /* ---------- Submission card ---------- */
  .sub{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
  .sub.approved{border-left-color:var(--green)}
  .sub.denied{border-left-color:var(--red);opacity:.75}
  .subhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .sub h3{margin:0 0 3px;font-size:17.5px;line-height:1.3}
  .when{font-size:13px;color:var(--muted)}
  .pill{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    padding:4px 10px;border-radius:20px;white-space:nowrap}
  .pill.pending{background:#fdf3e3;color:var(--amber-dk);border:1px solid #f6e3c2}
  .pill.approved{background:var(--green-bg);color:var(--green);border:1px solid var(--green-line)}
  .pill.denied{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:12px 20px;margin:15px 0 0;padding:15px 0 0;border-top:1px solid var(--line)}
  .cell .k{display:block;font-size:10.5px;font-weight:800;letter-spacing:.7px;
    text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .cell .v{font-size:14.5px;word-break:break-word}
  .cell .v.none{color:#aab2bd;font-style:italic}
  .cell.wide{grid-column:1/-1}
  .cell a{color:var(--navy-2)}

  .pair{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
  .pair .why{font-size:12.5px;color:var(--amber-dk);font-weight:700;text-transform:uppercase;
    letter-spacing:.6px;margin-bottom:10px}
  .pair .names{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .pair .name{flex:1;min-width:180px;padding:10px 12px;background:var(--bg);
    border:1px solid var(--line);border-radius:8px}
  .pair .name b{display:block;font-size:15.5px}
  .pair .name span{font-size:12.5px;color:var(--muted)}
  .pair .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

  .codebar{display:flex;gap:12px;align-items:center;margin-top:14px;padding:11px 13px;
    background:#eef2f7;border:1px solid #dde4ee;border-radius:8px;flex-wrap:wrap}
  .codebar .k{display:block;font-size:10.5px;font-weight:800;letter-spacing:.7px;
    text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .codebar code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;
    letter-spacing:1.5px;font-weight:700;color:var(--navy)}
  .codebar button{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:7px;
    border:1px solid var(--line);background:#fff;color:var(--navy-2);cursor:pointer}
  .codebar button:hover{border-color:var(--steel)}

  .vidrow{display:flex;gap:12px;align-items:center;margin-top:14px;padding-top:13px;
    border-top:1px solid var(--line);flex-wrap:wrap}
  .vidrow img{width:120px;height:68px;object-fit:cover;border-radius:6px;
    border:1px solid var(--line);background:#000;flex:none}
  .vidrow .meta2{font-size:13.5px;min-width:180px;flex:1}
  .vidrow .k{display:block;font-size:10.5px;font-weight:800;letter-spacing:.7px;
    text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .vidbad{color:#8f2419;font-weight:600}

  .contact{background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:11px 13px;margin-top:14px;font-size:14px}
  .contact .k{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
    color:var(--muted);display:block;margin-bottom:3px}

  .editform{margin-top:15px;padding-top:14px;border-top:1px solid var(--line);
    display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .editform .full{grid-column:1/-1}
  .editform label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.7px;
    text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .editform input,.editform textarea,.editform select{width:100%;padding:8px 10px;
    border:1px solid var(--line);border-radius:7px;font-size:14px;font-family:inherit}
  .editform textarea{min-height:70px;resize:vertical}
  /* Tick boxes, not a text field — the values are a fixed list, and a typo here
     would put a match in a filter nobody looks in. */
  .gunpick{display:flex;flex-wrap:wrap;gap:8px 16px}
  .gunpick label{display:flex;align-items:center;gap:6px;font-size:13.5px;
    font-weight:600;text-transform:none;letter-spacing:0;color:var(--text);
    margin:0;cursor:pointer}
  .gunpick input{width:16px;height:16px;margin:0;accent-color:var(--navy-2);cursor:pointer}
  .editform input:focus,.editform textarea:focus,.editform select:focus{
    outline:2px solid var(--navy-2);outline-offset:-1px}
  @media (max-width:600px){ .editform{grid-template-columns:1fr} }

  .actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
  .act{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;
    padding:9px 16px;border-radius:8px;cursor:pointer;border:1px solid}
  .act:disabled{opacity:.5;cursor:default}
  .act.approve{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
  .act.approve:hover:not(:disabled){background:var(--green);color:#fff;border-color:var(--green)}
  .act.deny{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
  .act.deny:hover:not(:disabled){background:var(--red);color:#fff;border-color:var(--red)}
  .act.neutral{background:#fff;border-color:var(--line);color:var(--muted)}
  .act.neutral:hover:not(:disabled){border-color:var(--steel);color:var(--text)}
  .act .ic{font-size:15px;line-height:1}

  .rowmsg{font-size:13px;margin-top:10px;padding:8px 11px;border-radius:7px}
  .rowmsg.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-line)}
  .rowmsg.bad{background:var(--red-bg);color:#8f2419;border:1px solid var(--red-line)}

  .empty{background:var(--card);border:1px dashed var(--steel);border-radius:var(--radius);
    padding:48px 24px;text-align:center;color:var(--muted)}
  .empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:5px}
  .spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--navy-2);
    border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  footer.pad{height:50px}

  @media (max-width:600px){
    .actions .act{flex:1;justify-content:center}
  }
</style>
</head>
<body>

<!-- ---------- Login ---------- -->
<div id="loginview" hidden>
  <div class="loginwrap">
    <h2>Event Review</h2>
    <p class="sub">Enter the admin password to review submissions.</p>
    <div id="loginmsg"></div>
    <form id="loginform">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" autofocus>
      <button class="btn" type="submit" id="loginbtn">Sign In</button>
    </form>
  </div>
</div>

<!-- ---------- Dashboard ---------- -->
<div id="appview" hidden>
  <header class="site">
    <div class="wrap hrow">
      <div>
        <h1>Event Review</h1>
        <div class="who" id="who"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="linkbtn" id="viewsite">View calendar</button>
        <button class="linkbtn" id="exportjson">Backup JSON</button>
        <button class="linkbtn" id="exportcsv">Backup CSV</button>
        <button class="linkbtn" id="signout">Sign out</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="pending">Pending<span class="n" id="n-pending">0</span></button>
      <button class="tab" data-tab="approved">Approved<span class="n" id="n-approved">0</span></button>
      <button class="tab" data-tab="denied">Denied<span class="n" id="n-denied">0</span></button>
      <button class="tab" data-tab="all">All<span class="n" id="n-all">0</span></button>
      <button class="tab" data-tab="merge">Duplicate shooters<span class="n" id="n-merge">·</span></button>
    </div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search name, venue, city, submitter…" autocomplete="off">
      <button class="refresh" id="refresh">Refresh</button>
    </div>

    <div id="rows"><div class="spinner"></div></div>
  </div>
  <footer class="pad"></footer>
</div>

<script type="module">
/* Access sits in front of this page and the Worker re-verifies the Access
   token on every API call, so there is no login form and no key here. */
const API = "/api/admin";
const CALENDAR_URL = "/";

const GUN_TYPES = ["Airgun", "Rimfire", "Centerfire", "Shotgun", "Muzzleloader", "Archery"];

const STATES = {
  AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",
  CT:"Connecticut",DE:"Delaware",DC:"District of Columbia",FL:"Florida",GA:"Georgia",
  HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",
  LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",
  MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",
  NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",
  OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",
  SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",
  WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming"
};
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

let ROWS = [], TAB = "pending";
const EDITING = new Set();

/* ---------- Helpers ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function parseDate(s){
  if(!s) return null;
  const p = String(s).slice(0,10).split("-").map(Number);
  return p.length === 3 && !p.some(isNaN) ? new Date(p[0],p[1]-1,p[2]) : null;
}
function fmtDate(s){
  const d = parseDate(s);
  return d ? `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}` : "—";
}
function fmtRange(r){
  const s = parseDate(r.start_date), e = parseDate(r.end_date);
  if(!s) return "—";
  if(!e || e.getTime() === s.getTime()) return fmtDate(r.start_date);
  if(s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear())
    return `${MONTHS[s.getMonth()]} ${s.getDate()}–${e.getDate()}, ${s.getFullYear()}`;
  return `${fmtDate(r.start_date)} – ${fmtDate(r.end_date)}`;
}
function ago(ts){
  const then = new Date(ts), mins = Math.floor((Date.now() - then) / 60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins + (mins === 1 ? " minute ago" : " minutes ago");
  const h = Math.floor(mins/60);
  if(h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.floor(h/24);
  if(d < 30) return d + (d === 1 ? " day ago" : " days ago");
  return then.toLocaleDateString();
}
// Same strict extraction the public site uses — the thumbnail URL is built
// from a validated 11-character ID, never from the submitted string.
function youtubeId(url){
  if(!url) return null;
  let u; try { u = new URL(url); } catch { return null; }
  const host = u.hostname.replace(/^www\.|^m\./, "").toLowerCase();
  let id = null;
  if(host === "youtu.be") id = u.pathname.slice(1);
  else if(host === "youtube.com" || host === "youtube-nocookie.com"){
    if(u.pathname === "/watch") id = u.searchParams.get("v");
    else { const m = u.pathname.match(/^\/(embed|shorts|live|v)\/([^/?#]+)/); if(m) id = m[2]; }
  }
  return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
}
function videoRow(url){
  if(!url) return "";
  const id = youtubeId(url);
  return `<div class="vidrow">
    ${id ? `<img src="https://i.ytimg.com/vi/${esc(id)}/mqdefault.jpg" alt="Video thumbnail">` : ""}
    <div class="meta2">
      <span class="k">Promo video</span>
      <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>
      ${id ? "" : `<div class="vidbad">Not a recognisable YouTube link — it won't embed.</div>`}
    </div>
  </div>`;
}

function cell(label, value, opts = {}){
  const empty = value === null || value === undefined || value === "";
  const shown = empty ? "not provided" : (opts.html ? value : esc(value));
  return `<div class="cell${opts.wide ? " wide" : ""}">
    <span class="k">${esc(label)}</span>
    <span class="v${empty ? " none" : ""}">${shown}</span>
  </div>`;
}

/* ---------- Session ---------- */
const show = (id, on) => document.getElementById(id).hidden = !on;

function loginMsg(text, kind = "err"){
  document.getElementById("loginmsg").innerHTML =
    text ? `<div class="msg ${kind}">${esc(text)}</div>` : "";
}

document.getElementById("loginform").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("loginbtn");
  btn.disabled = true; btn.textContent = "Signing in…";
  loginMsg("");

  const res = await fetch(`${API}/login`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ password: document.getElementById("password").value })
  });
  const out = await res.json().catch(() => ({}));

  btn.disabled = false; btn.textContent = "Sign In";
  document.getElementById("password").value = "";

  if(!res.ok){ loginMsg(out.error || "Sign in failed."); return; }
  show("loginview", false); show("appview", true);
  load();
});

document.getElementById("signout").addEventListener("click", async () => {
  await fetch(`${API}/logout`, { method: "POST" });
  ROWS = [];
  show("appview", false); show("loginview", true);
  loginMsg("You've been signed out.", "info");
});

/* Probe the API once. A 403 means no valid session, so show the login form. */
async function boot(){
  const res = await fetch(`${API}/events`, { headers: { accept: "application/json" } });
  if(res.status === 403){ show("loginview", true); show("appview", false); return; }
  show("loginview", false); show("appview", true);
  const { events } = await res.json().catch(() => ({ events: [] }));
  ROWS = events || [];
  render();
}

document.getElementById("viewsite").addEventListener("click", () => window.open(CALENDAR_URL, "_blank"));
document.getElementById("exportjson").addEventListener("click", () => location.href = API + "/export?format=json");
document.getElementById("exportcsv").addEventListener("click", () => location.href = API + "/export?format=csv");

/* ---------- Data ---------- */
async function load(){
  document.getElementById("rows").innerHTML = '<div class="spinner"></div>';
  const res = await fetch(`${API}/events`, { headers: { accept: "application/json" } });
  if(res.status === 403){
    show("appview", false); show("loginview", true);
    loginMsg("Your session expired. Please sign in again.", "info");
    return;
  }
  if(!res.ok){
    const msg = `The server responded ${res.status}.`;
    document.getElementById("rows").innerHTML =
      `<div class="empty"><strong>Couldn't load submissions.</strong>${esc(msg)}</div>`;
    return;
  }
  const { events } = await res.json();
  ROWS = events || [];
  render();
}

async function setStatus(id, status, btn){
  const card = document.getElementById("row-" + id);
  [...card.querySelectorAll("button")].forEach(b => b.disabled = true);
  if(btn) btn.textContent = "Saving…";

  const res = await fetch(`${API}/events/${id}`, {
    method: "PATCH",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ status })
  });
  const out = await res.json().catch(() => ({}));

  if(!res.ok){
    [...card.querySelectorAll("button")].forEach(b => b.disabled = false);
    card.insertAdjacentHTML("beforeend",
      `<div class="rowmsg bad">Couldn't save: ${esc(out.error || res.status)}</div>`);
    return;
  }
  const i = ROWS.findIndex(r => r.id === id);
  if(i > -1 && out.event) ROWS[i] = out.event;
  render();
}

/* ---------- Render ---------- */
function render(){
  const counts = { pending:0, approved:0, denied:0, all:ROWS.length };
  ROWS.forEach(r => counts[r.status]++);
  ["pending","approved","denied","all"].forEach(k => {
    document.getElementById("n-" + k).textContent = counts[k];
  });

  const q = document.getElementById("search").value.trim().toLowerCase();
  let list = ROWS.filter(r => TAB === "all" || r.status === TAB);
  if(q){
    list = list.filter(r =>
      [r.name,r.venue,r.city,r.state,STATES[r.state],(r.gun_types||[]).join(" "),(r.disciplines||[]).join(" "),
       r.org,r.note,r.submitter_name,r.submitter_email]
        .filter(Boolean).join(" ").toLowerCase().includes(q));
  }

  const box = document.getElementById("rows");

  if(TAB === "merge"){ renderMerge(box); return; }

  if(!list.length){
    box.innerHTML = `<div class="empty"><strong>${
      q ? "Nothing matches that search."
        : TAB === "pending" ? "Nothing waiting for review."
        : "Nothing here yet."
    }</strong>${
      TAB === "pending" && !q ? "New submissions will appear here automatically." : ""
    }</div>`;
    return;
  }

  box.innerHTML = list.map(r => {
    const isPending = r.status === "pending";
    const link = r.url
      ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.url)}</a>`
      : "";
    return `<article class="sub ${esc(r.status)}" id="row-${esc(r.id)}">
      <div class="subhead">
        <div>
          <h3>${esc(r.name)}</h3>
          <div class="when">Submitted ${esc(ago(r.created_at))}${
            r.reviewed_at && !isPending ? " · reviewed " + esc(ago(r.reviewed_at)) : ""
          }</div>
        </div>
        <span class="pill ${esc(r.status)}">${esc(r.status)}</span>
      </div>

      <div class="grid">
        ${cell("Dates", fmtRange(r))}
        ${cell("Venue", r.venue)}
        ${cell("City", r.city)}
        ${cell("State", STATES[r.state] || r.state)}
        ${cell("Shot with", (r.gun_types || []).join(" · "))}
        ${cell("Disciplines", (r.disciplines || []).join(" · "))}
        ${cell("Organization", r.org)}
        ${cell("Junior eligible", r.juniors ? "Yes" : "No")}
        ${cell("Registration link", link || "", { html:true, wide:true })}
        ${cell("Details", r.note, { wide:true })}
      </div>

      ${r.results_token ? `<div class="codebar">
        <div>
          <span class="k">Results upload code</span>
          <code>${esc(r.results_token)}</code>
        </div>
        <button type="button" data-copycode="${esc(r.results_token)}">Copy code</button>
        <button type="button" data-copylink="${esc(r.results_token)}">Copy link</button>
        <button type="button" data-newcode="${esc(r.id)}">New code</button>
        ${r.results_updated_at ? `<span style="font-size:12.5px;color:var(--green);font-weight:600">Results posted</span>` : ""}
      </div>` : ""}

      ${videoRow(r.video_url)}

      <div class="contact">
        <span class="k">Submitted by</span>
        ${esc(r.submitter_name)} — <a href="mailto:${esc(r.submitter_email)}?subject=${
          encodeURIComponent("Your event submission: " + r.name)
        }">${esc(r.submitter_email)}</a>
      </div>

      ${EDITING.has(r.id) ? `
      <form class="editform" data-editform="${esc(r.id)}">
        <div class="full">
          <label>Event name</label>
          <input name="name" value="${esc(r.name)}" maxlength="160" required>
        </div>
        <div><label>Start date</label><input type="date" name="start_date" value="${esc(r.start_date || "")}" required></div>
        <div><label>End date</label><input type="date" name="end_date" value="${esc(r.end_date || "")}"></div>
        <div><label>Venue</label><input name="venue" value="${esc(r.venue)}" maxlength="160" required></div>
        <div><label>City</label><input name="city" value="${esc(r.city)}" maxlength="100" required></div>
        <div><label>State</label><input name="state" value="${esc(r.state)}" maxlength="2" required style="text-transform:uppercase"></div>
        <div><label>Junior eligible</label>
          <select name="juniors">
            <option value="1"${r.juniors ? " selected" : ""}>Yes</option>
            <option value="0"${r.juniors ? "" : " selected"}>No</option>
          </select>
        </div>
        <div class="full"><label>Shot with</label>
          <div class="gunpick">${GUN_TYPES.map(g => `<label><input type="checkbox" name="gun_types" value="${esc(g)}"${
            (r.gun_types || []).includes(g) ? " checked" : ""}> ${esc(g)}</label>`).join("")}</div></div>
        <div class="full"><label>Disciplines (comma separated, max 8)</label>
          <input name="disciplines" value="${esc((r.disciplines || []).join(", "))}" required></div>
        <div class="full"><label>Organization</label>
          <input name="org" value="${esc(r.org || "")}" maxlength="120"></div>
        <div class="full"><label>Registration link</label>
          <input name="url" value="${esc(r.url || "")}" placeholder="https://"></div>
        <div class="full"><label>YouTube video</label>
          <input name="video_url" value="${esc(r.video_url || "")}" placeholder="https://www.youtube.com/watch?v=…"></div>
        <div class="full"><label>Details</label>
          <textarea name="note" maxlength="1000">${esc(r.note || "")}</textarea></div>
        <div class="full" style="display:flex;gap:9px;flex-wrap:wrap">
          <button class="act approve" type="submit">Save changes</button>
          <button class="act neutral" type="button" data-canceledit="${esc(r.id)}">Cancel</button>
        </div>
      </form>` : ""}

      <div class="actions">
        <button class="act neutral" data-edit="${esc(r.id)}">${EDITING.has(r.id) ? "Close editor" : "Edit"}</button>
        ${isPending ? `
          <button class="act approve" data-approve="${esc(r.id)}"><span class="ic">✓</span> Approve</button>
          <button class="act deny"    data-deny="${esc(r.id)}"><span class="ic">✕</span> Deny</button>
        ` : `
          <button class="act neutral" data-pending="${esc(r.id)}">Move back to pending</button>
          ${r.status === "denied"
            ? `<button class="act approve" data-approve="${esc(r.id)}"><span class="ic">✓</span> Approve instead</button>`
            : `<button class="act deny" data-deny="${esc(r.id)}"><span class="ic">✕</span> Remove from calendar</button>`}
        `}
        <button class="act neutral" data-delete="${esc(r.id)}">Delete permanently</button>
      </div>
    </article>`;
  }).join("");
}

/* ---------- Duplicate shooters ---------- */
let PAIRS = null;

async function renderMerge(box){
  if(PAIRS === null){
    box.innerHTML = '<div class="spinner"></div>';
    const res = await fetch(`${API}/duplicates`);
    if(!res.ok){
      box.innerHTML = `<div class="empty"><strong>Couldn't load shooters.</strong></div>`;
      return;
    }
    const out = await res.json();
    PAIRS = out.pairs || [];
    document.getElementById("n-merge").textContent = PAIRS.length;
  }

  if(!PAIRS.length){
    box.innerHTML = `<div class="empty"><strong>No likely duplicates.</strong>
      Names that look like the same shooter written differently will appear here.</div>`;
    return;
  }

  box.innerHTML = PAIRS.map((p, i) => `
    <div class="pair" id="pair-${i}">
      <div class="why">${esc(p.reason)}</div>
      <div class="names">
        <div class="name"><b>${esc(p.a.display_name)}</b>
          <span>${p.a.result_count} result${p.a.result_count === 1 ? "" : "s"}</span></div>
        <div class="name"><b>${esc(p.b.display_name)}</b>
          <span>${p.b.result_count} result${p.b.result_count === 1 ? "" : "s"}</span></div>
      </div>
      <div class="acts">
        <button class="act approve" data-merge="${i}" data-from="${p.b.id}" data-into="${p.a.id}">
          Keep &ldquo;${esc(p.a.display_name)}&rdquo;
        </button>
        <button class="act approve" data-merge="${i}" data-from="${p.a.id}" data-into="${p.b.id}">
          Keep &ldquo;${esc(p.b.display_name)}&rdquo;
        </button>
        <button class="act neutral" data-ignore="${i}">Different people</button>
      </div>
    </div>`).join("");
}

document.getElementById("rows").addEventListener("click", async e => {
  const ig = e.target.closest("button[data-ignore]");
  if(ig){ PAIRS.splice(Number(ig.dataset.ignore), 1);
          document.getElementById("n-merge").textContent = PAIRS.length;
          render(); return; }

  const mg = e.target.closest("button[data-merge]");
  if(!mg) return;

  const card = document.getElementById("pair-" + mg.dataset.merge);
  [...card.querySelectorAll("button")].forEach(b => b.disabled = true);

  const res = await fetch(`${API}/merge`, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ from: Number(mg.dataset.from), into: Number(mg.dataset.into) })
  });
  const out = await res.json().catch(() => ({}));
  if(!res.ok){
    [...card.querySelectorAll("button")].forEach(b => b.disabled = false);
    card.insertAdjacentHTML("beforeend", `<div class="rowmsg bad">${esc(out.error || "Merge failed.")}</div>`);
    return;
  }
  PAIRS.splice(Number(mg.dataset.merge), 1);
  document.getElementById("n-merge").textContent = PAIRS.length;
  render();
});

/* ---------- Events ---------- */
document.getElementById("rows").addEventListener("click", async e => {
  const btn = e.target.closest("button[data-approve],button[data-deny],button[data-pending],button[data-delete]");
  if(!btn) return;
  const d = btn.dataset;

  if(d.approve) return setStatus(d.approve, "approved", btn);
  if(d.deny)    return setStatus(d.deny, "denied", btn);
  if(d.pending) return setStatus(d.pending, "pending", btn);

  if(d.delete){
    const row = ROWS.find(r => r.id === d.delete);
    if(!confirm(`Permanently delete "${row ? row.name : "this event"}"?\n\nThis cannot be undone. To simply take it off the calendar, use Deny instead.`)) return;
    btn.disabled = true; btn.textContent = "Deleting…";
    const res = await fetch(`${API}/events/${d.delete}`, { method: "DELETE" });
    if(!res.ok){
      const out = await res.json().catch(() => ({}));
      btn.disabled = false; btn.textContent = "Delete permanently";
      alert("Couldn't delete: " + (out.error || res.status));
      return;
    }
    ROWS = ROWS.filter(r => r.id !== d.delete);
    render();
  }
});

// ---- editing ----
// ---- results code actions ----
document.getElementById("rows").addEventListener("click", async e => {
  const cc = e.target.closest("button[data-copycode]");
  if(cc){ await navigator.clipboard.writeText(cc.dataset.copycode);
          cc.textContent = "Copied"; setTimeout(()=>cc.textContent="Copy code",1500); return; }

  const cl = e.target.closest("button[data-copylink]");
  if(cl){ await navigator.clipboard.writeText(
            `${location.origin}/results.html?code=${cl.dataset.copylink}`);
          cl.textContent = "Copied"; setTimeout(()=>cl.textContent="Copy link",1500); return; }

  const nc = e.target.closest("button[data-newcode]");
  if(nc){
    if(!confirm("Issue a new code? The old one stops working immediately.")) return;
    const res = await fetch(`${API}/events/${nc.dataset.newcode}`, {
      method: "PATCH", headers: { "content-type": "application/json" },
      body: JSON.stringify({ regenerate_code: true })
    });
    const out = await res.json().catch(() => ({}));
    if(!res.ok){ alert("Couldn't issue a new code: " + (out.error || res.status)); return; }
    const i = ROWS.findIndex(r => r.id === nc.dataset.newcode);
    if(i > -1 && out.event) ROWS[i] = out.event;
    render();
  }
});

document.getElementById("rows").addEventListener("click", e => {
  const ed = e.target.closest("button[data-edit]");
  if(ed){ EDITING.has(ed.dataset.edit) ? EDITING.delete(ed.dataset.edit) : EDITING.add(ed.dataset.edit); render(); return; }
  const ca = e.target.closest("button[data-canceledit]");
  if(ca){ EDITING.delete(ca.dataset.canceledit); render(); }
});

document.getElementById("rows").addEventListener("submit", async e => {
  const form = e.target.closest("form[data-editform]");
  if(!form) return;
  e.preventDefault();
  const id = form.dataset.editform;
  const f = Object.fromEntries(new FormData(form).entries());

  const payload = {
    name: f.name, start_date: f.start_date, end_date: f.end_date || null,
    venue: f.venue, city: f.city, state: (f.state || "").toUpperCase(),
    juniors: f.juniors === "1",
    gun_types: [...form.querySelectorAll('input[name="gun_types"]:checked')].map(b => b.value),
    disciplines: f.disciplines.split(",").map(s => s.trim()).filter(Boolean),
    org: f.org || null, url: f.url || null, video_url: f.video_url || null,
    note: f.note || null
  };

  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true; btn.textContent = "Saving…";

  const res = await fetch(`${API}/events/${id}`, {
    method: "PATCH",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(payload)
  });
  const out = await res.json().catch(() => ({}));

  if(!res.ok){
    btn.disabled = false; btn.textContent = "Save changes";
    let box = form.querySelector(".rowmsg");
    if(!box){ box = document.createElement("div"); box.className = "rowmsg bad full"; form.appendChild(box); }
    box.textContent = out.error || `Couldn't save (${res.status}).`;
    return;
  }

  const i = ROWS.findIndex(r => r.id === id);
  if(i > -1 && out.event) ROWS[i] = out.event;
  EDITING.delete(id);
  render();
});

document.getElementById("tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if(!t) return;
  TAB = t.dataset.tab;
  [...document.querySelectorAll(".tab")].forEach(x => x.classList.toggle("on", x === t));
  render();
});
document.getElementById("search").addEventListener("input", render);
document.getElementById("refresh").addEventListener("click", load);

boot();
</script>
