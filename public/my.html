  .board .row2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:19px;width:100%;
               background:none;border-left:0;border-right:0;border-top:0;border-radius:0;color:var(--text);font-weight:600;min-height:56px;text-align:left}
  .board .row2:last-child{border-bottom:0}

  .srow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-bottom:10px}
  .srow input{font-size:19px;min-height:54px}

  .chk{display:flex;gap:12px;align-items:center;font-size:18px;font-weight:600;margin:14px 0 4px;text-transform:none;letter-spacing:0;color:var(--text)}
  .chk input{width:28px;height:28px;min-height:0;flex:none}

  .tune td{padding:6px;border-top:1px solid var(--line)}
  .tune .up{color:var(--red);font-weight:700}.tune .down{color:var(--green);font-weight:700}
  .grp2{margin-bottom:12px}
  [hidden]{display:none!important}
  @media (min-width:700px){ .types{grid-template-columns:repeat(4,1fr)} }
  @media (prefers-reduced-motion:no-preference){ .sheet .panel{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.4}} }
</style>

<body>
<header>
  <h1>My Scores</h1>
  <a href="/">Match calendar</a>
</header>

<main id="main" aria-live="polite"></main>

<nav class="tabs" aria-label="Sections">
  <button data-go="log"><span class="ic" aria-hidden="true">＋</span>Log</button>
  <button data-go="history"><span class="ic" aria-hidden="true">☰</span>History</button>
  <button data-go="stats"><span class="ic" aria-hidden="true">▲</span>Stats</button>
  <button data-go="backup"><span class="ic" aria-hidden="true">⇩</span>Backup</button>
</nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
"use strict";

/* ====================================================================
   STORAGE
   Every score lives in this browser's own database (IndexedDB). Nothing is
   sent to GunMatches. If IndexedDB isn't available (some private modes) it
   falls back to localStorage, and if that fails too the app still works for
   the session and tells the person to back up.
   ==================================================================== */
var ENTRIES = [];           // in memory, always the truth for the screen
var META = { lastBackup: null, changesSince: 0 };
var idb = null, usingLS = false, storageNote = "";

function openDB(){
  return new Promise(function(resolve){
    if(!window.indexedDB){ resolve(null); return; }
    try{
      var req = indexedDB.open("gm-my-scores", 1);
      req.onupgradeneeded = function(){
        var db = req.result;
        if(!db.objectStoreNames.contains("entries")) db.createObjectStore("entries", { keyPath: "id" });
        if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ resolve(null); };
      req.onblocked = function(){ resolve(null); };
    }catch(e){ resolve(null); }
  });
}
function tx(store, mode, fn){
  return new Promise(function(resolve, reject){
    var t = idb.transaction(store, mode), s = t.objectStore(store), out = fn(s);
    t.oncomplete = function(){ resolve(out && out.result); };
    t.onerror = t.onabort = function(){ reject(t.error); };
  });
}
function lsSave(){
  try{ localStorage.setItem("gm-my-scores", JSON.stringify({ entries: ENTRIES, meta: META })); }
  catch(e){ storageNote = "This browser wouldn't let us save. Back up often."; }
}
function loadAll(){
  return openDB().then(function(db){
    idb = db;
    if(idb){
      return Promise.all([tx("entries","readonly",function(s){ return s.getAll(); }), tx("meta","readonly",function(s){ return s.get("meta"); })])
        .then(function(r){ ENTRIES = r[0] || []; META = Object.assign(META, r[1] || {}); });
    }
    usingLS = true;
    try{
      var raw = JSON.parse(localStorage.getItem("gm-my-scores") || "null");
      if(raw){ ENTRIES = raw.entries || []; META = Object.assign(META, raw.meta || {}); }
    }catch(e){}
  }).catch(function(){ usingLS = true; });
}
function saveEntry(e){
  var i = ENTRIES.findIndex(function(x){ return x.id === e.id; });
  if(i > -1) ENTRIES[i] = e; else ENTRIES.push(e);
  META.changesSince++;
  return persist(function(){ return tx("entries","readwrite",function(s){ return s.put(e); }); });
}
function removeEntry(id){
  ENTRIES = ENTRIES.filter(function(x){ return x.id !== id; });
  META.changesSince++;
  return persist(function(){ return tx("entries","readwrite",function(s){ return s.delete(id); }); });
}
function saveMeta(){ return persist(function(){ return tx("meta","readwrite",function(s){ return s.put(META,"meta"); }); }, true); }
function persist(idbFn, metaOnly){
  if(!usingLS && idb){
    return idbFn().then(function(){ return metaOnly ? null : saveMeta(); }).catch(function(){ usingLS = true; lsSave(); });
  }
  lsSave(); return Promise.resolve();
}

/* ====================================================================
   HELPERS
   ==================================================================== */
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function todayISO(){ var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
var MO = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function parseISO(s){ var p = String(s||"").slice(0,10).split("-").map(Number); return p.length === 3 && !p.some(isNaN) ? new Date(p[0], p[1]-1, p[2]) : null; }
function fmtDate(s){ var d = parseISO(s); return d ? ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()] + " " + MO[d.getMonth()].slice(0,3) + " " + d.getDate() + ", " + d.getFullYear() : s; }
function num(v){ var n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; }
function pct(a, b){ return b > 0 ? Math.round(a / b * 1000) / 10 : 0; }
function toast(msg){ var t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function(){ t.hidden = true; }, 2600); }
var TYPES = {
  match:    { name: "Friendly match", short: "Match", blurb: "Tap HIT or MISS" },
  ft:       { name: "Hits by stage (older entry)", short: "Hits", blurb: "Totals typed in by stage" },
  group:    { name: "Benchrest groups", short: "Groups", blurb: "Group size and distance" },
  points:   { name: "Points / total", short: "Points", blurb: "Score and X count" },
  practice: { name: "Practice session", short: "Practice", blurb: "Rounds, notes, setup" }
};

/* ---- results, worked out from what was entered ---- */
function ftTotals(e){
  var h = 0, s = 0;
  (e.data.stages || []).forEach(function(st){ h += st.hits || 0; s += st.shots || 0; });
  return { hits: h, shots: s, pct: pct(h, s) };
}
function groupToMOA(size, sizeUnit, dist, distUnit){
  if(!size || !dist) return null;
  var inches = sizeUnit === "mm" ? size / 25.4 : sizeUnit === "moa" ? null : size;
  var yards = distUnit === "m" ? dist * 1.09361 : dist;
  if(sizeUnit === "moa") return size;
  return inches / (yards * 1.047 / 100);
}
function groupStats(e){
  var d = e.data, arr = (d.groups || []).filter(function(x){ return x > 0; });
  if(!arr.length) return null;
  var best = Math.min.apply(null, arr), avg = arr.reduce(function(a,b){ return a+b; }, 0) / arr.length;
  return { best: best, avg: avg, n: arr.length,
           bestMOA: groupToMOA(best, d.sizeUnit, d.distance, d.distUnit),
           avgMOA: groupToMOA(avg, d.sizeUnit, d.distance, d.distUnit) };
}
/* ---- airgun tuning: group-size consistency and shot speed (FPS) ---- */
function mean(a){ return a.reduce(function(x, y){ return x + y; }, 0) / a.length; }
function sdev(a){ if(a.length < 2) return 0; var m = mean(a); return Math.sqrt(a.reduce(function(x, y){ return x + (y - m) * (y - m); }, 0) / (a.length - 1)); }
function parseFps(str){
  if(Array.isArray(str)) return str;
  return (String(str || "").match(/\d+(?:\.\d+)?/g) || []).map(Number).filter(function(x){ return x >= 50 && x <= 2500; });
}
function tuneStats(d){
  var sizes = [], fps = [];
  (d.groups || []).forEach(function(g, i){
    var v = num(g); if(v > 0){ sizes.push(v); fps.push(parseFps(d.fps && d.fps[i] != null ? d.fps[i] : "")); }
  });
  if(!sizes.length) return null;
  var t = { sizes: sizes, n: sizes.length, mean: mean(sizes), sd: sdev(sizes), min: Math.min.apply(null, sizes), max: Math.max.apply(null, sizes) };
  t.range = t.max - t.min; t.cv = t.mean ? t.sd / t.mean * 100 : 0;
  t.deltas = sizes.slice(1).map(function(v, i){ return v - sizes[i]; });
  t.absDelta = t.deltas.length ? mean(t.deltas.map(Math.abs)) : null;
  var all = [].concat.apply([], fps);
  t.fpsPer = fps.map(function(a){ return a.length ? { avg: mean(a), es: Math.max.apply(null, a) - Math.min.apply(null, a), n: a.length } : null; });
  if(all.length){ t.fpsMean = mean(all); t.fpsSD = sdev(all); t.fpsES = Math.max.apply(null, all) - Math.min.apply(null, all); t.fpsN = all.length; }
  return t;
}
function consistencyWord(cv, n){
  if(n < 2) return "—";
  return cv <= 10 ? "Very consistent" : cv <= 20 ? "Consistent" : cv <= 35 ? "Some variation" : "Wide variation";
}
function moaOf(d, v){ return groupToMOA(v, d.sizeUnit, num(d.distance), d.distUnit); }
function prevTuning(e){
  return ENTRIES.filter(function(x){
    return x.type === "group" && x.data && x.data.tuning && x.id !== e.id && (x.gun || "") === (e.gun || "") &&
      ((x.date || "") < (e.date || "") || ((x.date || "") === (e.date || "") && (x.created || 0) < (e.created || 0)));
  }).sort(byDateDesc)[0] || null;
}
function sgn(n, unit, lowerIsBetter){
  if(Math.abs(n) < 0.005) return '<span>no change</span>';
  var better = lowerIsBetter ? n < 0 : n > 0;
  return '<span class="' + (better ? "down" : "up") + '">' + (n < 0 ? "▼ " : "▲ ") + r2(Math.abs(n)) + " " + unit + (lowerIsBetter ? (n < 0 ? " tighter" : " wider") : "") + '</span>';
}
/* The tuning report: how steady the groups are, and the speed behind them. */
function tuningHTML(e){
  var d = e.data, t = tuneStats(d); if(!t) return "";
  var u = d.sizeUnit === "moa" ? "MOA" : d.sizeUnit, h = '<div class="tune"><h3>Tuning report</h3>';
  h += '<div class="kpis" style="margin-bottom:8px"><div class="kpi"><b style="font-size:19px">' + consistencyWord(t.cv, t.n) + '</b><span>Consistency' + (t.n > 1 ? " · " + r2(t.cv) + "% spread" : "") + '</span></div>' +
    '<div class="kpi"><b>' + r2(t.sd) + ' ' + u + '</b><span>Group size spread (std. dev.)</span></div>' +
    '<div class="kpi"><b>' + r2(t.range) + ' ' + u + '</b><span>Smallest to largest group</span></div>' +
    '<div class="kpi"><b>' + (t.absDelta == null ? "—" : r2(t.absDelta) + " " + u) + '</b><span>Average change, group to group</span></div></div>';
  if(t.fpsMean != null){
    h += '<div class="kpis" style="margin-bottom:8px"><div class="kpi"><b>' + Math.round(t.fpsMean) + ' FPS</b><span>Average speed (' + t.fpsN + ' shots)</span></div>' +
      '<div class="kpi"><b>' + Math.round(t.fpsES) + ' FPS</b><span>Extreme spread (fastest − slowest)</span></div>' +
      '<div class="kpi"><b>' + r2(t.fpsSD) + ' FPS</b><span>Speed std. deviation</span></div></div>';
  }
  h += '<table><tr><th>Group</th><th>Size</th><th>Change</th>' + (t.fpsMean != null ? '<th>Avg FPS</th><th>Spread</th>' : "") + '</tr>' +
    t.sizes.map(function(v, i){
      var dl = i ? t.deltas[i - 1] : null, f = t.fpsPer[i];
      return '<tr><td>' + (i + 1) + '</td><td>' + r2(v) + ' ' + u + '</td><td>' + (dl == null ? "—" : '<span class="' + (dl < 0 ? "down" : dl > 0 ? "up" : "") + '">' + (dl < 0 ? "▼ " : dl > 0 ? "▲ " : "") + r2(Math.abs(dl)) + '</span>') + '</td>' +
        (t.fpsMean != null ? '<td>' + (f ? Math.round(f.avg) : "—") + '</td><td>' + (f ? Math.round(f.es) : "—") + '</td>' : "") + '</tr>';
    }).join("") + '</table>';
  var pv = prevTuning(e);
  if(pv){
    var pt = tuneStats(pv.data);
    if(pt){
      var curM = t.sizes.map(function(v){ return moaOf(d, v); }), prM = pt.sizes.map(function(v){ return moaOf(pv.data, v); });
      if(curM.every(function(x){ return x != null; }) && prM.every(function(x){ return x != null; })){
        var dm = mean(curM) - mean(prM), ds = sdev(curM) - sdev(prM);
        h += '<p class="sm" style="margin:8px 0 2px"><b>Compared with your last tuning session' + (e.gun ? " on " + esc(e.gun) : "") + ' (' + esc(fmtDate(pv.date)) + '):</b></p>' +
          '<p class="sm" style="margin:2px 0">Average group: ' + sgn(dm, "MOA", true) + '</p>' +
          '<p class="sm" style="margin:2px 0">Consistency (spread): ' + sgn(ds, "MOA", true) + '</p>';
        if(t.fpsMean != null && pt.fpsMean != null)
          h += '<p class="sm" style="margin:2px 0">Average speed: ' + (Math.abs(t.fpsMean - pt.fpsMean) < 0.5 ? "no change" : (t.fpsMean > pt.fpsMean ? "▲ " : "▼ ") + Math.round(Math.abs(t.fpsMean - pt.fpsMean)) + " FPS") + '</p>' +
            '<p class="sm" style="margin:2px 0">Speed spread (ES): ' + sgn(t.fpsES - pt.fpsES, "FPS", true).replace(" tighter", " steadier") + '</p>';
      }
    }
  }
  return h + '<p class="sm" style="margin:8px 0 0">Consistency compares how far your groups stray from their own average. A lower spread means steadier shooting.</p></div>';
}

/* ---- friendly matches: shooters, each with a string of hit (1) / miss (0) ---- */
function mHits(sh){ return (sh.results || []).reduce(function(a,b){ return a + b; }, 0); }
function matchStandings(e){
  var list = (e.data.shooters || []).map(function(sh, i){ return { i: i, name: sh.name, hits: mHits(sh), shots: (sh.results || []).length }; });
  list.sort(function(a,b){ return b.hits - a.hits || a.i - b.i; });
  list.forEach(function(r){ r.place = 1 + list.filter(function(o){ return o.hits > r.hits; }).length; r.tie = list.filter(function(o){ return o.hits === r.hits; }).length > 1; });
  return list;
}
function entryStages(e){ var d = e.data; return d.stages && d.stages.length ? d.stages : [{ name: "", shots: d.shots || (d.shooters && d.shooters[0] ? d.shooters[0].results.length : 0) }]; }
function stageOffset(stages, s){ var o = 0; for(var i = 0; i < s; i++) o += stages[i].shots; return o; }
function stageHits(sh, stages, s){ var o = stageOffset(stages, s), r = (sh.results || []).slice(o, o + stages[s].shots); return { hits: r.reduce(function(a, b){ return a + b; }, 0), shots: r.length }; }
function stageLine(e, i){
  var st = entryStages(e); if(st.length < 2) return "";
  return st.map(function(x, s){ var h = stageHits(e.data.shooters[i], st, s); return esc(x.name || "Stage " + (s + 1)) + " " + h.hits + "/" + h.shots; }).join(" · ");
}
function ordinal(n){ var s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function myTotals(e){
  var d = e.data; if(e.type !== "match" || d.me == null || !d.shooters || !d.shooters[d.me]) return null;
  var sh = d.shooters[d.me], shots = (sh.results || []).length; return shots ? { hits: mHits(sh), shots: shots, pct: pct(mHits(sh), shots) } : null;
}
function hitPct(e){ return e.type === "ft" ? ftTotals(e).pct : myTotals(e).pct; }
function hasHitRate(e){ return e.type === "ft" || !!myTotals(e); }

function headline(e){
  if(e.type === "match"){
    var st = matchStandings(e); if(!st.length) return "Match";
    var d = e.data, me = d.me != null ? st.find(function(r){ return r.i === d.me; }) : null;
    if(me && st.length > 1) return "You: " + me.hits + "/" + me.shots + " · " + (me.tie ? "T-" : "") + ordinal(me.place) + " of " + st.length;
    if(me) return me.hits + " / " + me.shots + " · " + pct(me.hits, me.shots) + "%";
    return (st[0].tie ? "Tie: " : "Winner: ") + st[0].name + " " + st[0].hits + "/" + st[0].shots;
  }
  if(e.type === "ft"){ var t = ftTotals(e); return t.hits + " / " + t.shots + " · " + t.pct + "%"; }
  if(e.type === "group"){
    var g = groupStats(e); if(!g) return "No groups";
    var u = e.data.sizeUnit === "moa" ? "MOA" : e.data.sizeUnit;
    return "Best " + r2(g.best) + " " + u + (g.bestMOA != null && e.data.sizeUnit !== "moa" ? " · " + r2(g.bestMOA) + " MOA" : "");
  }
  if(e.type === "points"){
    var d = e.data; return d.score + (d.max ? " / " + d.max : "") + (d.x ? " · " + d.x + "X" : "");
  }
  var p = e.data; return (p.rounds ? p.rounds + " rounds" : "Practice") + (p.minutes ? " · " + p.minutes + " min" : "");
}
function r2(n){ return Math.round(n * 100) / 100; }
function subline(e){
  var parts = [];
  if(e.type === "match") parts.push((e.data.shooters || []).length + " shooter" + ((e.data.shooters || []).length === 1 ? "" : "s"));
  if(e.type === "ft" && e.data.discipline) parts.push(e.data.discipline);
  if(e.type === "group") parts.push(e.data.distance + " " + e.data.distUnit + (e.data.shots ? " · " + e.data.shots + " shots" : ""));
  if(e.type === "points" && e.data.discipline) parts.push(e.data.discipline);
  if(e.gun) parts.push(e.gun);
  return parts.join(" · ");
}

function newSetup(){ return { title: "", location: "", names: [""], me: 0, format: "one", shots: 10, stages: [{ name: "", shots: 5 }, { name: "", shots: 5 }], rotate: false }; }

          return '<div class="stagecard"><input class="sn" value="' + esc(st.name) + '" placeholder="Stage ' + (i+1) + ' name (optional)" maxlength="40" aria-label="Stage ' + (i+1) + ' name">' +
            '<div class="srow2"><span class="muted">Shots</span><div class="bigstep"><button class="ghost" type="button" data-m="ss" data-i="' + i + '" data-d="-1" aria-label="One fewer shot on stage ' + (i+1) + '">−</button><b>' + st.shots + '</b>' +

function readSetup(){
  if(!SETUP) return;
  var nm = $$(".nm"); if(nm.length) SETUP.names = nm.map(function(i){ return i.value; });
  $$(".sn").forEach(function(inp, i){ if(SETUP.stages[i]) SETUP.stages[i].name = inp.value; });
  var r = $("#rot"); if(r) SETUP.rotate = r.checked;
  var t = $("#mtitle"); if(t) SETUP.title = t.value.trim();
  var l = $("#mloc"); if(l) SETUP.location = l.value.trim();
}
function startMatch(){
  readSetup();
  var S = SETUP, names = S.names.map(function(n, i){ return (n || "").trim() || "Shooter " + (i + 1); });
  var stages = S.format === "stages"
    ? S.stages.map(function(x, i){ return { name: (x.name || "").trim() || "Stage " + (i + 1), shots: x.shots }; })
    : [{ name: "", shots: S.shots }];
  LIVE = { id: uid(), title: S.title, location: S.location, date: todayISO(), stages: stages, stage: 0, rotate: S.rotate, me: Math.min(S.me, names.length - 1),
           shooters: names.map(function(n){ return { name: n, results: [] }; }), cur: 0, log: [], done: false,
           note: stages.length > 1 ? "Stage 1: " + stages[0].name + "." : "" };
  SETUP = null; saveLive(); viewPlay();
}
function liveRemaining(i){
  var st = LIVE.stages[LIVE.stage];
  return st.shots - (LIVE.shooters[i].results.length - stageOffset(LIVE.stages, LIVE.stage));
}
function viewPlay(){
  var m = LIVE; if(!m){ go("log"); return; }
  if(m.done){ viewResults(); return; }
  var st = m.stages[m.stage], multi = m.stages.length > 1;
  var s = m.shooters[m.cur], off = stageOffset(m.stages, m.stage), n = s.results.length - off;
  var stageRes = s.results.slice(off, off + st.shots), hits = stageRes.reduce(function(a, b){ return a + b; }, 0);
  var dots = ""; for(var i = 0; i < st.shots; i++){
    var r = stageRes[i], cls = r === 1 ? "h" : r === 0 ? "m" : "";
    dots += '<span class="dot ' + cls + (i === n ? " cur" : "") + '" role="img" aria-label="Shot ' + (i+1) + ': ' + (r === 1 ? "hit" : r === 0 ? "miss" : "not yet") + '"></span>';
  }
  main.innerHTML = (m.note ? '<div class="note">' + esc(m.note) + '</div>' : "") +
    (multi ? '<div class="stagebar">Stage ' + (m.stage + 1) + ' of ' + m.stages.length + ' · ' + esc(st.name) + '</div>' : "") +
    '<div class="card"><p class="whoshoots">' + esc(s.name) + '</p><p class="shotof">Shot ' + (n + 1) + ' of ' + st.shots + ' · ' + hits + ' hit' + (hits === 1 ? "" : "s") + (multi ? " on this stage" : " so far") + '</p>' +
    '<div class="dots">' + dots + '</div>' +
    '<div class="hitmiss"><button class="hit" data-m="shot" data-v="1" aria-label="Hit"><i aria-hidden="true">✓</i>HIT</button>' +
    '<button class="miss" data-m="shot" data-v="0" aria-label="Miss"><i aria-hidden="true">✕</i>MISS</button></div>' +
    '<button class="ghost" data-m="undo" style="width:100%;min-height:60px;font-size:19px"' + (m.log.length ? "" : " disabled") + '>↶ Undo last shot</button></div>' +
    (m.shooters.length > 1 ? '<div class="card board"><h3>Scoreboard' + (multi ? " · total" : "") + '</h3>' + m.shooters.map(function(sh, i){
      return '<button class="row2' + (i === m.cur ? " now" : "") + '" data-m="pick" data-i="' + i + '"' + (liveRemaining(i) <= 0 && i !== m.cur ? " disabled" : "") + '><span>' + (i === m.cur ? "▶ " : "") + esc(sh.name) + '</span><b>' + mHits(sh) + ' / ' + sh.results.length + '</b></button>';
    }).join("") + '</div>' : "") +
    '<div class="actions"><button class="ghost" data-m="finish">Finish early</button><button class="danger" data-m="discard">Throw this match away</button></div>';
  m.note = ""; saveLive();
  window.scrollTo(0, 0);
}
function shoot(hit){
  var m = LIVE; if(!m || m.done) return;
  var from = m.cur, sh = m.shooters[from];
  if(liveRemaining(from) <= 0) return;
  sh.results.push(hit ? 1 : 0); m.log.push({ i: from, s: m.stage });
  if(navigator.vibrate) try{ navigator.vibrate(hit ? 40 : [30, 50, 30]); }catch(e){}
  if(m.rotate || liveRemaining(from) <= 0){
    var k = m.shooters.length, next = -1;
    for(var j = 1; j <= k; j++){ var idx = (from + j) % k; if(liveRemaining(idx) > 0){ next = idx; break; } }
    if(next < 0){
      // everyone has finished this stage
      if(m.stage + 1 < m.stages.length){
        m.stage++; m.cur = 0;
        m.note = "Stage " + m.stage + " finished. Now stage " + (m.stage + 1) + ": " + m.stages[m.stage].name + ". " + m.shooters[0].name + " is up.";
      } else m.done = true;
    } else {
      if(next !== from && !m.rotate) m.note = sh.name + " finished with " + stageHits(sh, m.stages, m.stage).hits + " of " + m.stages[m.stage].shots + ". Next up: " + m.shooters[next].name + ".";
      m.cur = next;
    }
  }
  saveLive(); viewPlay();
}
function undoShot(){
  var m = LIVE; if(!m || !m.log.length) return;
  var last = m.log.pop(); m.shooters[last.i].results.pop(); m.cur = last.i; m.stage = last.s; m.done = false; m.note = "Last shot removed.";
  saveLive(); viewPlay();
}
function liveEntry(m){ return { type: "match", data: { stages: m.stages, shooters: m.shooters, me: m.me } }; }
function viewResults(){

function validate(e){
  var d = e.data;
  if(e.type === "ft"){ var t = ftTotals(e); if(!t.shots) return "Add at least one stage."; }
  if(e.type === "group"){
    var pairs = [];
    d.groups.forEach(function(g, i){ var v = num(g); if(v > 0) pairs.push({ v: v, f: d.tuning ? parseFps(d.fps && d.fps[i] != null ? d.fps[i] : "") : [] }); });
    if(!pairs.length) return "Enter at least one group size.";
    if(!(num(d.distance) > 0)) return "Enter the distance.";
    d.groups = pairs.map(function(p){ return p.v; }); d.fps = d.tuning ? pairs.map(function(p){ return p.f; }) : [];
    d.distance = num(d.distance); d.shots = parseInt(d.shots, 10) || null;
  }
  if(e.type === "points"){
    if(num(d.score) == null) return "Enter your score.";
    d.score = num(d.score); d.max = num(d.max); d.x = parseInt(d.x, 10) || 0;
  }
  if(e.type === "practice"){
    d.rounds = parseInt(d.rounds, 10) || 0; d.minutes = parseInt(d.minutes, 10) || 0;
    if(!d.rounds && !e.notes) return "Add the rounds fired or a note.";
  }
  return null;
}

/* ---------- match picker (reads the public calendar) ---------- */
function loadMatches(){
  return fetch("/api/events", { headers: { accept: "application/json" } }).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      var list = (j.events || []).map(function(x){ return { id: x.id, name: x.name, start: x.start_date, place: x.city + ", " + x.state, venue: x.venue }; });
      try{ localStorage.setItem("gm-matches", JSON.stringify(list)); }catch(e){}
      return list;
    }).catch(function(){ try{ return JSON.parse(localStorage.getItem("gm-matches") || "[]"); }catch(e){ return []; } });
}
function pickMatch(){
  openSheet('<h2>Pick a match</h2><p>Fills in the name, date and place. You can still change them.</p><input id="mq" type="search" placeholder="Search matches…"><div id="mlist" style="margin-top:10px"><p>Loading…</p></div><div class="actions"><button class="ghost" data-act="close">Close</button></div>');
  loadMatches().then(function(all){
    var today = todayISO();
    var from = new Date(); from.setDate(from.getDate() - 30);
    var lo = from.toISOString().slice(0,10);
    var base = all.filter(function(m){ return m.start >= lo; }).sort(function(a,b){ return a.start.localeCompare(b.start); });
    function draw(){
      var q = ($("#mq").value || "").trim().toLowerCase();
      var rows = base.filter(function(m){ return !q || (m.name + " " + m.place + " " + m.venue).toLowerCase().indexOf(q) > -1; }).slice(0, 60);
      $("#mlist").innerHTML = rows.length ? rows.map(function(m){
        return '<button class="item" data-match="' + esc(m.id) + '"><div class="t">' + esc(m.name) + '</div><div class="sub">' + esc(fmtDate(m.start)) + ' · ' + esc(m.place) + '</div></button>';
      }).join("") : '<p>' + (all.length ? "No matches found." : "Couldn't load the calendar. You can type the name instead.") + '</p>';
      $$("#mlist [data-match]").forEach(function(b){ b.addEventListener("click", function(){
        var m = all.find(function(x){ return x.id === b.dataset.match; });
        readForm(); DRAFT.title = m.name; DRAFT.date = m.start <= today ? m.start : today; DRAFT.location = m.venue || m.place; DRAFT.matchId = m.id;
        closeSheet(); viewForm(ENTRIES.some(function(x){ return x.id === DRAFT.id; }));
      }); });
    }
    $("#mq").addEventListener("input", draw); draw();
  });
}

/* ---------- Stats ---------- */
function spark(values, fmt){
  if(values.length < 2) return "";
  var w = 300, h = 70, pad = 6, min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  if(max === min){ max += 1; min -= 1; }
  var pts = values.map(function(v, i){ return [pad + i * (w - 2*pad) / (values.length - 1), h - pad - (v - min) / (max - min) * (h - 2*pad)]; });
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Trend over your last ' + values.length + ' entries"><polyline fill="none" stroke="#1f3b5c" stroke-width="2.5" stroke-linejoin="round" points="' +
    pts.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + '"/>' +
    pts.map(function(p, i){ return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (i === pts.length-1 ? 4 : 2.5) + '" fill="' + (i === pts.length-1 ? "#b71d1c" : "#1f3b5c") + '"/>'; }).join("") + '</svg>';
}
var STATGUN = "";
function viewStats(){
  if(!ENTRIES.length){ main.innerHTML = '<div class="empty">Log a few scores and your trends will show up here.</div>'; return; }
  var guns = uniq(ENTRIES.map(function(e){ return e.gun; }));
  var set = ENTRIES.filter(function(e){ return !STATGUN || e.gun === STATGUN; }).sort(function(a,b){ return a.date.localeCompare(b.date) || a.created - b.created; });
  var now = new Date(), ym = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
  var thisMonth = set.filter(function(e){ return e.date.slice(0,7) === ym; }).length;
  var rounds = 0;
  set.forEach(function(e){
    if(e.type === "ft") rounds += ftTotals(e).shots;
    else if(e.type === "match"){ var mt = myTotals(e); if(mt) rounds += mt.shots; }
    else if(e.type === "practice") rounds += e.data.rounds || 0;
    else if(e.type === "group") rounds += (e.data.shots || 0) * (e.data.groups || []).length;
  });
  var h = (guns.length > 1 ? '<div class="card"><label for="sg" style="margin-top:0">Gun</label><select id="sg"><option value="">All guns</option>' + guns.map(function(g){ return '<option' + (STATGUN === g ? " selected" : "") + '>' + esc(g) + '</option>'; }).join("") + '</select></div>' : "");
  h += '<div class="card"><h2>Overview</h2><div class="kpis"><div class="kpi"><b>' + set.length + '</b><span>Entries logged</span></div><div class="kpi"><b>' + thisMonth + '</b><span>This month</span></div>' +
    '<div class="kpi"><b>' + rounds.toLocaleString() + '</b><span>Shots recorded</span></div><div class="kpi"><b>' + uniq(set.map(function(e){ return e.date; })).length + '</b><span>Days shot</span></div></div></div>';

  var ft = set.filter(hasHitRate);
  if(ft.length){
    var ps = ft.map(hitPct), recent = ps.slice(-20);
    var avg = ps.reduce(function(a,b){ return a+b; }, 0) / ps.length;
    h += '<div class="card"><h2>Hit rate</h2><div class="kpis"><div class="kpi"><b>' + r2(avg) + '%</b><span>Average hit rate</span></div><div class="kpi"><b>' + Math.max.apply(null, ps) + '%</b><span>Best session</span></div></div>' +
      '<p class="sm">Hit rate, last ' + recent.length + ' sessions</p>' + (recent.length > 1 ? spark(recent) : '<p class="sm">Log one more to see a trend.</p>') + '</div>';
  }
  var grp = set.filter(function(e){ return e.type === "group" && groupStats(e) && groupStats(e).bestMOA != null; });
  if(grp.length){
    var byDist = {};
    grp.forEach(function(e){ var k = e.data.distance + " " + e.data.distUnit; var g = groupStats(e); (byDist[k] = byDist[k] || []).push(g.bestMOA); });
    h += '<div class="card"><h2>Groups</h2>' + Object.keys(byDist).sort(function(a,b){ return parseFloat(a) - parseFloat(b); }).map(function(k){
      var v = byDist[k]; return '<div class="stage" style="grid-template-columns:1fr auto auto"><b>' + esc(k) + '</b><span class="muted sm">best</span><b>' + r2(Math.min.apply(null, v)) + ' MOA</b></div>' +
        '<div class="sm muted" style="padding:2px 0 8px">' + v.length + ' session' + (v.length === 1 ? "" : "s") + ', average ' + r2(v.reduce(function(a,b){ return a+b; }, 0) / v.length) + ' MOA</div>';
    }).join("") + '</div>';
  }
  var pts = set.filter(function(e){ return e.type === "points" && e.data.max > 0; });
  if(pts.length){
    var pp = pts.map(function(e){ return pct(e.data.score, e.data.max); });
    h += '<div class="card"><h2>Points</h2><div class="kpis"><div class="kpi"><b>' + r2(pp.reduce(function(a,b){ return a+b; }, 0) / pp.length) + '%</b><span>Average</span></div><div class="kpi"><b>' + Math.max.apply(null, pp) + '%</b><span>Best</span></div></div>' + (pp.length > 1 ? spark(pp.slice(-20)) : "") + '</div>';
  }
  var tun = set.filter(function(e){ return e.type === "group" && e.data.tuning && tuneStats(e.data); });
  if(tun.length){
    var rows = tun.slice(-8).map(function(e){
      var t = tuneStats(e.data), m = t.sizes.map(function(v){ return moaOf(e.data, v); });
      return { e: e, t: t, moa: m.every(function(x){ return x != null; }) ? mean(m) : null };
    });
    var series = rows.filter(function(r){ return r.moa != null; }).map(function(r){ return r.moa; });
    var best = rows.filter(function(r){ return r.t.n > 1; }).sort(function(a, b){ return a.t.cv - b.t.cv; })[0];
    h += '<div class="card"><h2>Airgun tuning</h2>' + (series.length > 1 ? '<p class="sm">Average group size (MOA), last ' + series.length + ' tuning sessions. Lower is better.</p>' + spark(series) : "") +
      (best ? '<p class="sm">Most consistent session: <b>' + esc(fmtDate(best.e.date)) + '</b>' + (best.e.gun ? " on " + esc(best.e.gun) : "") + ' (' + r2(best.t.cv) + '% spread)</p>' : "") +
      '<div class="tune"><table><tr><th>Date</th><th>Avg group</th><th>Spread</th><th>Avg FPS</th></tr>' + rows.slice().reverse().map(function(r){
        var u = r.e.data.sizeUnit === "moa" ? "MOA" : r.e.data.sizeUnit;
        return '<tr><td>' + esc(fmtDate(r.e.date).replace(/, \d{4}$/, "")) + '</td><td>' + r2(r.t.mean) + ' ' + u + '</td><td>' + (r.t.n > 1 ? r2(r.t.sd) : "—") + '</td><td>' + (r.t.fpsMean != null ? Math.round(r.t.fpsMean) : "—") + '</td></tr>';
      }).join("") + '</table></div></div>';
  }
  main.innerHTML = h;
  var sg = $("#sg"); if(sg) sg.addEventListener("change", function(){ STATGUN = sg.value; viewStats(); });
}

/* ---------- Backup ---------- */
function download(name, text, type){
  var blob = new Blob([text], { type: type }), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function backupFile(){
  var payload = JSON.stringify({ app: "gunmatches-my-scores", version: 1, exported: new Date().toISOString(), entries: ENTRIES }, null, 1);
  download("my-scores-backup-" + todayISO() + ".json", payload, "application/json");
  META.lastBackup = Date.now(); META.changesSince = 0; saveMeta();
}
function csvEsc(v){ v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV(){
  var head = ["Date","Type","Title","Result","Hits","Shots","Hit %","Best group","Avg group","Group unit","Distance","Score","Out of","X","Rounds","Minutes","Avg FPS","FPS spread (ES)","Group spread (SD)","Gun","Pellet/load","Wind","Temp","Where","Notes"];
  var rows = ENTRIES.slice().sort(byDateDesc).map(function(e){
    var d = e.data, ft = e.type === "ft" ? ftTotals(e) : null, g = e.type === "group" ? groupStats(e) : null, tu = e.type === "group" && d.tuning ? tuneStats(d) : null;
    return [e.date, TYPES[e.type].name, e.title, headline(e), ft ? ft.hits : "", ft ? ft.shots : "", ft ? ft.pct : "",
      g ? r2(g.best) : "", g ? r2(g.avg) : "", g ? (d.sizeUnit === "moa" ? "MOA" : d.sizeUnit) : "", g ? d.distance + " " + d.distUnit : "",
      e.type === "points" ? d.score : "", e.type === "points" ? d.max : "", e.type === "points" ? d.x : "",
      e.type === "practice" ? d.rounds : "", e.type === "practice" ? d.minutes : "",
      tu && tu.fpsMean != null ? Math.round(tu.fpsMean) : "", tu && tu.fpsES != null ? Math.round(tu.fpsES) : "", tu ? r2(tu.sd) : "", e.gun, e.ammo, e.wind, e.temp, e.location, e.notes].map(csvEsc).join(",");
  });
  download("my-scores-" + todayISO() + ".csv", "﻿" + [head.join(",")].concat(rows).join("\r\n"), "text/csv");
}
function validEntry(x){
  return x && typeof x.id === "string" && TYPES[x.type] && typeof x.date === "string" && x.data && typeof x.data === "object";
}
function restore(file){
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var j = JSON.parse(rd.result), list = Array.isArray(j) ? j : j.entries;
      if(!Array.isArray(list)) throw 0;
      var added = 0, updated = 0, skipped = 0;
      list.forEach(function(x){
        if(!validEntry(x)){ skipped++; return; }
        var cur = ENTRIES.find(function(y){ return y.id === x.id; });
        if(!cur){ added++; saveEntry(x); }
        else if((x.updated || x.created || 0) > (cur.updated || cur.created || 0)){ updated++; saveEntry(x); }
      });
      META.changesSince = 0; saveMeta();
      toast("Restored: " + added + " added, " + updated + " updated" + (skipped ? ", " + skipped + " skipped" : "") + ".");
      viewBackup();
    }catch(e){ toast("That doesn't look like a My Scores backup file."); }
  };
  rd.readAsText(file);
}
function viewBackup(){
  var last = META.lastBackup ? new Date(META.lastBackup).toLocaleDateString() : "never";
  main.innerHTML = '<div class="card"><h2>Your data</h2><p><b>' + ENTRIES.length + '</b> entr' + (ENTRIES.length === 1 ? "y" : "ies") + ' saved on this device. Last backup: <b>' + esc(last) + '</b>' +
    (META.changesSince ? ' · ' + META.changesSince + ' change' + (META.changesSince === 1 ? "" : "s") + ' since' : "") + '.</p>' +
    '<p>Your scores are stored only on this phone or tablet. GunMatches never sees them. That keeps them private and keeps this free, but it means <b>a backup file is your safety net</b>.</p>' +
    '<div class="stack"><button data-act="backup-now">Save a backup file</button><button class="ghost" data-act="csv">Export for a spreadsheet (CSV)</button>' +
    '<button class="ghost" data-act="restore">Restore from a backup file</button><input type="file" id="rfile" accept=".json,application/json" hidden></div></div>' +
    '<div class="card"><h3>Moving to a new phone</h3><ol class="steps"><li>On the old phone, tap <b>Save a backup file</b> and send it to yourself (email, Drive, iCloud).</li><li>On the new phone, open gunmatches.com/my.</li><li>Tap <b>Restore from a backup file</b> and choose it.</li></ol></div>' +
    '<div class="card"><h3>Keeping it safe</h3><p id="persist" class="sm">' + esc(storageNote) + '</p>' +
    '<p class="sm">Add this page to your home screen so your phone treats it as an app and keeps its data longer. Clearing your browser history or “website data” will erase your scores unless you have a backup.</p>' +
    (usingLS ? '<p class="sm" style="color:var(--amber)">This browser is using limited storage. Back up often.</p>' : "") + '</div>' +
    '<div class="card"><h3>Looking for a match?</h3><p><a href="/">Browse the match calendar</a> · <a href="/rankings">National rankings</a></p></div>';
  if(navigator.storage && navigator.storage.persisted){
    navigator.storage.persisted().then(function(p){ var el = $("#persist"); if(el) el.textContent = p ? "Your browser has marked this data as protected from automatic clean-up." : "Your browser may clear this data if the device runs low on space. A backup protects you."; });
  }
}

/* ====================================================================
   EVENTS
   ==================================================================== */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("button, [data-go]"); if(!t) return;
  if(t.dataset.go){ closeSheet(); go(t.dataset.go); return; }
  if(t.dataset.new){ startEntry(t.dataset.new); return; }
  if(t.dataset.open){ detail(t.dataset.open); return; }
  if(t.dataset.edit){ var e = ENTRIES.find(function(x){ return x.id === t.dataset.edit; }); closeSheet(); if(e) startEntry(e.type, e); return; }
  if(t.dataset.share){
    var s = ENTRIES.find(function(x){ return x.id === t.dataset.share; }); if(!s) return;
    var text = shareText(s);
    if(navigator.share) navigator.share({ title: "My score", text: text }).catch(function(){});
    else if(navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ toast("Copied to your clipboard."); });
    return;
  }
  if(t.dataset.del){
    if(!confirm("Delete this entry? This can't be undone unless you have a backup.")) return;
    removeEntry(t.dataset.del).then(function(){ closeSheet(); toast("Deleted."); go(VIEW === "log" ? "log" : "history"); });
    return;
  }
  if(t.dataset.ftype !== undefined){ FILTER.type = t.dataset.ftype; viewHistory(); return; }
  if(t.dataset.hit){
    var row = t.closest(".stage"), inp = $('[data-f="hits"]', row), sh = $('[data-f="shots"]', row);
    var v = (parseInt(inp.value, 10) || 0) + Number(t.dataset.hit), cap = parseInt(sh.value, 10) || 1;
    inp.value = Math.max(0, Math.min(cap, v)); syncStagesFromDOM(); return;
  }
  if(t.dataset.rmgroup !== undefined){ readForm(); DRAFT.data.groups.splice(Number(t.dataset.rmgroup), 1); DRAFT.data.fps.splice(Number(t.dataset.rmgroup), 1); if(!DRAFT.data.groups.length){ DRAFT.data.groups = [""]; DRAFT.data.fps = [""]; } $("#typeform").innerHTML = typeForm(DRAFT); return; }
  if(t.dataset.match) return;
  if(t.dataset.m){
    var mm = t.dataset.m, ix = Number(t.dataset.i);
    switch(mm){
      case "setup": SETUP = null; viewSetup(); break;
      case "home": SETUP = null; go("log"); break;
      case "add": readSetup(); if(SETUP.names.length < 12){ SETUP.names.push(""); viewSetup(); var all = $$(".nm"); all[all.length - 1].focus(); } else toast("That's the most we can fit: 12 shooters."); break;
      case "rm": readSetup(); SETUP.names.splice(ix, 1); if(SETUP.me >= SETUP.names.length) SETUP.me = 0; else if(SETUP.me > ix) SETUP.me--; viewSetup(); break;
      case "me": readSetup(); SETUP.me = ix; viewSetup(); break;
      case "shots": readSetup(); SETUP.shots = Math.max(1, Math.min(100, SETUP.shots + Number(t.dataset.d))); $("#sh-n").textContent = SETUP.shots; break;
      case "fmt": readSetup(); SETUP.format = t.dataset.f; viewSetup(); break;
      case "addstage": readSetup(); if(SETUP.stages.length < 20){ var ls = SETUP.stages[SETUP.stages.length - 1]; SETUP.stages.push({ name: "", shots: ls ? ls.shots : 5 }); viewSetup(); var sn = $$(".sn"); sn[sn.length - 1].focus(); } else toast("That's the most we can fit: 20 stages."); break;
      case "rmstage": readSetup(); if(SETUP.stages.length > 1) SETUP.stages.splice(ix, 1); viewSetup(); break;
      case "ss": readSetup(); SETUP.stages[ix].shots = Math.max(1, Math.min(50, SETUP.stages[ix].shots + Number(t.dataset.d))); viewSetup(); break;
      case "start": startMatch(); break;
      case "resume": loadLive(); viewPlay(); break;
      case "shot": shoot(t.dataset.v === "1"); break;
      case "undo": undoShot(); break;
      case "pick": if(LIVE && liveRemaining(ix) > 0){ LIVE.cur = ix; saveLive(); viewPlay(); } break;
      case "finish": if(confirm("Finish now? Shots not taken yet won't count.")){ LIVE.done = true; saveLive(); viewResults(); } break;
      case "discard": if(confirm("Throw this match away? The scores will be lost.")){ LIVE = null; saveLive(); SETUP = null; go("log"); } break;
      case "share-live":
        var txt = liveShareText(LIVE);
        if(navigator.share) navigator.share({ title: "Match results", text: txt }).catch(function(){});
        else if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ toast("Copied to your clipboard."); });
        break;
      case "save": t.disabled = true; saveMatch(); break;
    }
    return;
  }
  switch(t.dataset.act){
    case "close": closeSheet(); break;
    case "cancel": go("log"); break;
    case "pick-match": pickMatch(); break;
    case "add-stage": syncStagesFromDOM(); var last = DRAFT.data.stages[DRAFT.data.stages.length - 1]; DRAFT.data.stages.push({ name: "", hits: 0, shots: last ? last.shots : 4 }); $("#typeform").innerHTML = typeForm(DRAFT); break;
    case "rm-stage": syncStagesFromDOM(); if(DRAFT.data.stages.length > 1) DRAFT.data.stages.pop(); $("#typeform").innerHTML = typeForm(DRAFT); break;
    case "add-group": readForm(); DRAFT.data.groups.push(""); DRAFT.data.fps.push(""); $("#typeform").innerHTML = typeForm(DRAFT); var gi = $$("#groups input[data-g]"); if(gi.length) gi[gi.length - 1].focus(); break;
    case "save":
      if(DRAFT.type === "ft") syncStagesFromDOM();
      readForm();
      var err = validate(DRAFT);
      if(err){ toast(err); break; }
      DRAFT.updated = Date.now();
      var editing = ENTRIES.some(function(x){ return x.id === DRAFT.id; });
      t.disabled = true;
      saveEntry(DRAFT).then(function(){ toast(editing ? "Changes saved." : "Score saved."); FILTER = { type: "", q: "", gun: "" }; go("history");
        if(!META.lastBackup && ENTRIES.length === 3) setTimeout(function(){ toast("Tip: save a backup file from the Backup tab."); }, 2800);
        if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
      });
      break;
    case "backup-now": backupFile(); toast("Backup saved to your downloads."); if(VIEW === "backup") viewBackup(); else if(VIEW === "log") viewLog(); break;
    case "csv": exportCSV(); break;
    case "restore": $("#rfile").click(); break;
    case "install": if(deferredInstall){ deferredInstall.prompt(); deferredInstall = null; } break;
  }
});
document.addEventListener("change", function(ev){
  if(ev.target.id === "rfile" && ev.target.files[0]) restore(ev.target.files[0]);
  if(ev.target.id === "g-tune"){ readForm(); $("#typeform").innerHTML = typeForm(DRAFT); return; }
  if(ev.target.id === "g-su" || ev.target.id === "g-du"){ readForm(); $("#g-sum").innerHTML = groupSum(DRAFT); $("#g-tune-box").innerHTML = tuneLive(); }
});
document.addEventListener("input", function(ev){
  var t = ev.target;
  if(t.closest && t.closest("#stages")) syncStagesFromDOM();
  if(t.matches && (t.matches("#groups input") || t.id === "g-dist")){ readForm(); $("#g-sum").innerHTML = groupSum(DRAFT); $("#g-tune-box").innerHTML = tuneLive(); }
});

loadAll().then(function(){
  var hash = location.hash.replace("#", "");
  go(["log","history","stats","backup"].indexOf(hash) > -1 ? hash : "log");
  if(navigator.storage && navigator.storage.persist && ENTRIES.length) navigator.storage.persist();
});
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("/sw.js").catch(function(){}); });
}
})();
