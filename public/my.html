<style>

  .chk{display:flex;gap:12px;align-items:center;font-size:18px;font-weight:600;margin:14px 0 4px;text-transform:none;letter-spacing:0;color:var(--text)}

  .pill.match{background:#e3f6e8;color:var(--green)}
  .fmt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}

  @media (prefers-reduced-motion:no-preference){ .sheet .panel{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.4}} }
  .bar{height:12px;background:#e6ebf1;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .2s}
  .tt{border-radius:12px;padding:12px 14px;border:2px solid}.tt.ok{background:#e8f6ec;border-color:#14603c;color:#14603c}.tt.warn{background:#fff4e0;border-color:#b86e00;color:#6b4300}
  .ttv{font-size:22px;font-weight:800;line-height:1.2;margin-bottom:4px}
  .rv{display:grid;grid-template-columns:28px 1fr;gap:2px 12px;align-items:start;padding:10px 0;border-top:1px solid var(--line);text-transform:none;letter-spacing:0;margin:0;font-size:15px;color:var(--text)}
  .rv input{width:26px;height:26px;min-height:0;grid-row:1/3}.rvl{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .rvv{font-size:17px;font-weight:600;color:var(--text);word-break:break-word}.rvv.none{color:#a0a8b3;font-weight:400;font-style:italic}
  .sm{font-size:14px;color:var(--muted)}
</style>

<body>
<header>
  <h1>My Scores</h1>
  <a href="/">Match calendar</a>
</header>

<main id="main" aria-live="polite"></main>

<nav class="tabs" aria-label="Sections">
  <button data-go="log"><span class="ic" aria-hidden="true">＋</span>Log</button>
  <button data-go="history"><span class="ic" aria-hidden="true">☰</span>History</button>
  <button data-go="stats"><span class="ic" aria-hidden="true">▲</span>Stats</button>
  <button data-go="rifle"><span class="ic" aria-hidden="true">◎</span>Rifle</button>
  <button data-go="backup"><span class="ic" aria-hidden="true">⇩</span>Backup</button>
</nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
"use strict";

/* ====================================================================
   STORAGE
   Every score lives in this browser's own database (IndexedDB). Nothing is
   sent to GunMatches. If IndexedDB isn't available (some private modes) it
   falls back to localStorage, and if that fails too the app still works for
   the session and tells the person to back up.
   ==================================================================== */
var ENTRIES = [];           // in memory, always the truth for the screen
var META = { lastBackup: null, changesSince: 0 };
var idb = null, usingLS = false, storageNote = "";

function openDB(){
  return new Promise(function(resolve){
    if(!window.indexedDB){ resolve(null); return; }
    try{
      var req = indexedDB.open("gm-my-scores", 2);
      req.onupgradeneeded = function(){
        var db = req.result;
        if(!db.objectStoreNames.contains("entries")) db.createObjectStore("entries", { keyPath: "id" });
        if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
        if(!db.objectStoreNames.contains("rifles")) db.createObjectStore("rifles", { keyPath: "id" });
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ resolve(null); };
      req.onblocked = function(){ resolve(null); };
    }catch(e){ resolve(null); }
  });
}
function tx(store, mode, fn){
  return new Promise(function(resolve, reject){
    var t = idb.transaction(store, mode), s = t.objectStore(store), out = fn(s);
    t.oncomplete = function(){ resolve(out && out.result); };
    t.onerror = t.onabort = function(){ reject(t.error); };
  });
}
function lsSave(){
  try{ localStorage.setItem("gm-my-scores", JSON.stringify({ entries: ENTRIES, rifles: RIFLES, meta: META })); }
  catch(e){ storageNote = "This browser wouldn't let us save. Back up often."; }
}
function loadAll(){
  return openDB().then(function(db){
    idb = db;
    if(idb){
      return Promise.all([tx("entries","readonly",function(s){ return s.getAll(); }), tx("meta","readonly",function(s){ return s.get("meta"); }), tx("rifles","readonly",function(s){ return s.getAll(); })])
        .then(function(r){ ENTRIES = r[0] || []; META = Object.assign(META, r[1] || {}); RIFLES = r[2] || []; });
    }
    usingLS = true;
    try{
      var raw = JSON.parse(localStorage.getItem("gm-my-scores") || "null");
      if(raw){ ENTRIES = raw.entries || []; RIFLES = raw.rifles || []; META = Object.assign(META, raw.meta || {}); }
    }catch(e){}
  }).catch(function(){ usingLS = true; });
}
function saveEntry(e){
  var i = ENTRIES.findIndex(function(x){ return x.id === e.id; });
  if(i > -1) ENTRIES[i] = e; else ENTRIES.push(e);
  META.changesSince++;
  return persist(function(){ return tx("entries","readwrite",function(s){ return s.put(e); }); });
}
function removeEntry(id){
  ENTRIES = ENTRIES.filter(function(x){ return x.id !== id; });
  META.changesSince++;
  return persist(function(){ return tx("entries","readwrite",function(s){ return s.delete(id); }); });
}
function saveMeta(){ return persist(function(){ return tx("meta","readwrite",function(s){ return s.put(META,"meta"); }); }, true); }
function persist(idbFn, metaOnly){
  if(!usingLS && idb){
    return idbFn().then(function(){ return metaOnly ? null : saveMeta(); }).catch(function(){ usingLS = true; lsSave(); });
  }
  lsSave(); return Promise.resolve();
}

/* ====================================================================
   HELPERS
   ==================================================================== */
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function todayISO(){ var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
var MO = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function parseISO(s){ var p = String(s||"").slice(0,10).split("-").map(Number); return p.length === 3 && !p.some(isNaN) ? new Date(p[0], p[1]-1, p[2]) : null; }
function fmtDate(s){ var d = parseISO(s); return d ? ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()] + " " + MO[d.getMonth()].slice(0,3) + " " + d.getDate() + ", " + d.getFullYear() : s; }
function num(v){ var n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; }
function pct(a, b){ return b > 0 ? Math.round(a / b * 1000) / 10 : 0; }
function toast(msg){ var t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function(){ t.hidden = true; }, 2600); }
var TYPES = {
  match:    { name: "Friendly match", short: "Match", blurb: "Tap HIT or MISS" },
  ft:       { name: "Hits by stage (older entry)", short: "Hits", blurb: "Totals typed in by stage" },
  group:    { name: "Benchrest groups", short: "Groups", blurb: "Group size and distance" },
  points:   { name: "Points / total", short: "Points", blurb: "Score and X count" },
  practice: { name: "Practice session", short: "Practice", blurb: "Rounds, notes, setup" }
};

/* ---- results, worked out from what was entered ---- */
function ftTotals(e){
  var h = 0, s = 0;
  (e.data.stages || []).forEach(function(st){ h += st.hits || 0; s += st.shots || 0; });
  return { hits: h, shots: s, pct: pct(h, s) };
}
function groupToMOA(size, sizeUnit, dist, distUnit){
  if(!size || !dist) return null;
  var inches = sizeUnit === "mm" ? size / 25.4 : sizeUnit === "moa" ? null : size;
  var yards = distUnit === "m" ? dist * 1.09361 : dist;
  if(sizeUnit === "moa") return size;
  return inches / (yards * 1.047 / 100);
}
function groupStats(e){
  var d = e.data, arr = (d.groups || []).filter(function(x){ return x > 0; });
  if(!arr.length) return null;
  var best = Math.min.apply(null, arr), avg = arr.reduce(function(a,b){ return a+b; }, 0) / arr.length;
  return { best: best, avg: avg, n: arr.length,
           bestMOA: groupToMOA(best, d.sizeUnit, d.distance, d.distUnit),
           avgMOA: groupToMOA(avg, d.sizeUnit, d.distance, d.distUnit) };
}
/* ---- airgun tuning: group-size consistency and shot speed (FPS) ---- */
function mean(a){ return a.reduce(function(x, y){ return x + y; }, 0) / a.length; }
function sdev(a){ if(a.length < 2) return 0; var m = mean(a); return Math.sqrt(a.reduce(function(x, y){ return x + (y - m) * (y - m); }, 0) / (a.length - 1)); }
function parseFps(str){
  if(Array.isArray(str)) return str;
  return (String(str || "").match(/\d+(?:\.\d+)?/g) || []).map(Number).filter(function(x){ return x >= 50 && x <= 2500; });
}
function tuneStats(d){
  var sizes = [], fps = [];
  (d.groups || []).forEach(function(g, i){
    var v = num(g); if(v > 0){ sizes.push(v); fps.push(parseFps(d.fps && d.fps[i] != null ? d.fps[i] : "")); }
  });
  if(!sizes.length) return null;
  var t = { sizes: sizes, n: sizes.length, mean: mean(sizes), sd: sdev(sizes), min: Math.min.apply(null, sizes), max: Math.max.apply(null, sizes) };
  t.range = t.max - t.min; t.cv = t.mean ? t.sd / t.mean * 100 : 0;
  t.deltas = sizes.slice(1).map(function(v, i){ return v - sizes[i]; });
  t.absDelta = t.deltas.length ? mean(t.deltas.map(Math.abs)) : null;
  var all = [].concat.apply([], fps);
  t.fpsPer = fps.map(function(a){ return a.length ? { avg: mean(a), es: Math.max.apply(null, a) - Math.min.apply(null, a), n: a.length } : null; });
  if(all.length){ t.fpsMean = mean(all); t.fpsSD = sdev(all); t.fpsES = Math.max.apply(null, all) - Math.min.apply(null, all); t.fpsN = all.length; }
  return t;
}
function consistencyWord(cv, n){
  if(n < 2) return "—";
  return cv <= 10 ? "Very consistent" : cv <= 20 ? "Consistent" : cv <= 35 ? "Some variation" : "Wide variation";
}
function moaOf(d, v){ return groupToMOA(v, d.sizeUnit, num(d.distance), d.distUnit); }
function prevTuning(e){
  return ENTRIES.filter(function(x){
    return x.type === "group" && x.data && x.data.tuning && x.id !== e.id && (x.gun || "") === (e.gun || "") &&
      ((x.date || "") < (e.date || "") || ((x.date || "") === (e.date || "") && (x.created || 0) < (e.created || 0)));
  }).sort(byDateDesc)[0] || null;
}
function sgn(n, unit, lowerIsBetter){
  if(Math.abs(n) < 0.005) return '<span>no change</span>';
  var better = lowerIsBetter ? n < 0 : n > 0;
  return '<span class="' + (better ? "down" : "up") + '">' + (n < 0 ? "▼ " : "▲ ") + r2(Math.abs(n)) + " " + unit + (lowerIsBetter ? (n < 0 ? " tighter" : " wider") : "") + '</span>';
}
/* The tuning report: how steady the groups are, and the speed behind them. */
function tuningHTML(e){
  var d = e.data, t = tuneStats(d); if(!t) return "";
  var u = d.sizeUnit === "moa" ? "MOA" : d.sizeUnit, h = '<div class="tune"><h3>Tuning report</h3>';
  h += '<div class="kpis" style="margin-bottom:8px"><div class="kpi"><b style="font-size:19px">' + consistencyWord(t.cv, t.n) + '</b><span>Consistency' + (t.n > 1 ? " · " + r2(t.cv) + "% spread" : "") + '</span></div>' +
    '<div class="kpi"><b>' + r2(t.sd) + ' ' + u + '</b><span>Group size spread (std. dev.)</span></div>' +
    '<div class="kpi"><b>' + r2(t.range) + ' ' + u + '</b><span>Smallest to largest group</span></div>' +
    '<div class="kpi"><b>' + (t.absDelta == null ? "—" : r2(t.absDelta) + " " + u) + '</b><span>Average change, group to group</span></div></div>';
  if(t.fpsMean != null){
    h += '<div class="kpis" style="margin-bottom:8px"><div class="kpi"><b>' + Math.round(t.fpsMean) + ' FPS</b><span>Average speed (' + t.fpsN + ' shots)</span></div>' +
      '<div class="kpi"><b>' + Math.round(t.fpsES) + ' FPS</b><span>Extreme spread (fastest − slowest)</span></div>' +
      '<div class="kpi"><b>' + r2(t.fpsSD) + ' FPS</b><span>Speed std. deviation</span></div></div>';
  }
  h += '<table><tr><th>Group</th><th>Size</th><th>Change</th>' + (t.fpsMean != null ? '<th>Avg FPS</th><th>Spread</th>' : "") + '</tr>' +
    t.sizes.map(function(v, i){
      var dl = i ? t.deltas[i - 1] : null, f = t.fpsPer[i];
      return '<tr><td>' + (i + 1) + '</td><td>' + r2(v) + ' ' + u + '</td><td>' + (dl == null ? "—" : '<span class="' + (dl < 0 ? "down" : dl > 0 ? "up" : "") + '">' + (dl < 0 ? "▼ " : dl > 0 ? "▲ " : "") + r2(Math.abs(dl)) + '</span>') + '</td>' +
        (t.fpsMean != null ? '<td>' + (f ? Math.round(f.avg) : "—") + '</td><td>' + (f ? Math.round(f.es) : "—") + '</td>' : "") + '</tr>';
    }).join("") + '</table>';
  var pv = prevTuning(e);
  if(pv){
    var pt = tuneStats(pv.data);
    if(pt){
      var curM = t.sizes.map(function(v){ return moaOf(d, v); }), prM = pt.sizes.map(function(v){ return moaOf(pv.data, v); });
      if(curM.every(function(x){ return x != null; }) && prM.every(function(x){ return x != null; })){
        var dm = mean(curM) - mean(prM), ds = sdev(curM) - sdev(prM);
        h += '<p class="sm" style="margin:8px 0 2px"><b>Compared with your last tuning session' + (e.gun ? " on " + esc(e.gun) : "") + ' (' + esc(fmtDate(pv.date)) + '):</b></p>' +
          '<p class="sm" style="margin:2px 0">Average group: ' + sgn(dm, "MOA", true) + '</p>' +
          '<p class="sm" style="margin:2px 0">Consistency (spread): ' + sgn(ds, "MOA", true) + '</p>';
        if(t.fpsMean != null && pt.fpsMean != null)
          h += '<p class="sm" style="margin:2px 0">Average speed: ' + (Math.abs(t.fpsMean - pt.fpsMean) < 0.5 ? "no change" : (t.fpsMean > pt.fpsMean ? "▲ " : "▼ ") + Math.round(Math.abs(t.fpsMean - pt.fpsMean)) + " FPS") + '</p>' +
            '<p class="sm" style="margin:2px 0">Speed spread (ES): ' + sgn(t.fpsES - pt.fpsES, "FPS", true).replace(" tighter", " steadier") + '</p>';
      }
    }
  }
  return h + '<p class="sm" style="margin:8px 0 0">Consistency compares how far your groups stray from their own average. A lower spread means steadier shooting.</p></div>';
}

/* ---- friendly matches: shooters, each with a string of hit (1) / miss (0) ---- */
function mHits(sh){ return (sh.results || []).reduce(function(a,b){ return a + b; }, 0); }
function matchStandings(e){
  var list = (e.data.shooters || []).map(function(sh, i){ return { i: i, name: sh.name, hits: mHits(sh), shots: (sh.results || []).length }; });
  list.sort(function(a,b){ return b.hits - a.hits || a.i - b.i; });
  list.forEach(function(r){ r.place = 1 + list.filter(function(o){ return o.hits > r.hits; }).length; r.tie = list.filter(function(o){ return o.hits === r.hits; }).length > 1; });
  return list;
}
function entryStages(e){ var d = e.data; return d.stages && d.stages.length ? d.stages : [{ name: "", shots: d.shots || (d.shooters && d.shooters[0] ? d.shooters[0].results.length : 0) }]; }
function stageOffset(stages, s){ var o = 0; for(var i = 0; i < s; i++) o += stages[i].shots; return o; }
function stageHits(sh, stages, s){ var o = stageOffset(stages, s), r = (sh.results || []).slice(o, o + stages[s].shots); return { hits: r.reduce(function(a, b){ return a + b; }, 0), shots: r.length }; }
function stageLine(e, i){
  var st = entryStages(e); if(st.length < 2) return "";
  return st.map(function(x, s){ var h = stageHits(e.data.shooters[i], st, s); return esc(x.name || "Stage " + (s + 1)) + " " + h.hits + "/" + h.shots; }).join(" · ");
}
function ordinal(n){ var s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function myTotals(e){
  var d = e.data; if(e.type !== "match" || d.me == null || !d.shooters || !d.shooters[d.me]) return null;
  var sh = d.shooters[d.me], shots = (sh.results || []).length; return shots ? { hits: mHits(sh), shots: shots, pct: pct(mHits(sh), shots) } : null;
}
function hitPct(e){ return e.type === "ft" ? ftTotals(e).pct : myTotals(e).pct; }
function hasHitRate(e){ return e.type === "ft" || !!myTotals(e); }

function headline(e){
  if(e.type === "match"){
    var st = matchStandings(e); if(!st.length) return "Match";
    var d = e.data, me = d.me != null ? st.find(function(r){ return r.i === d.me; }) : null;
    if(me && st.length > 1) return "You: " + me.hits + "/" + me.shots + " · " + (me.tie ? "T-" : "") + ordinal(me.place) + " of " + st.length;
    if(me) return me.hits + " / " + me.shots + " · " + pct(me.hits, me.shots) + "%";
    return (st[0].tie ? "Tie: " : "Winner: ") + st[0].name + " " + st[0].hits + "/" + st[0].shots;
  }
  if(e.type === "ft"){ var t = ftTotals(e); return t.hits + " / " + t.shots + " · " + t.pct + "%"; }
  if(e.type === "group"){
    var g = groupStats(e); if(!g) return "No groups";
    var u = e.data.sizeUnit === "moa" ? "MOA" : e.data.sizeUnit;
    return "Best " + r2(g.best) + " " + u + (g.bestMOA != null && e.data.sizeUnit !== "moa" ? " · " + r2(g.bestMOA) + " MOA" : "");
  }
  if(e.type === "points"){
    var d = e.data; return d.score + (d.max ? " / " + d.max : "") + (d.x ? " · " + d.x + "X" : "");
  }
  var p = e.data; return (p.rounds ? p.rounds + " rounds" : "Practice") + (p.minutes ? " · " + p.minutes + " min" : "");
}
function r2(n){ return Math.round(n * 100) / 100; }
function subline(e){
  var parts = [];
  if(e.type === "match") parts.push((e.data.shooters || []).length + " shooter" + ((e.data.shooters || []).length === 1 ? "" : "s"));
  if(e.type === "ft" && e.data.discipline) parts.push(e.data.discipline);
  if(e.type === "group") parts.push(e.data.distance + " " + e.data.distUnit + (e.data.shots ? " · " + e.data.shots + " shots" : ""));
  if(e.type === "points" && e.data.discipline) parts.push(e.data.discipline);
  if(e.gun) parts.push(e.gun);
  return parts.join(" · ");
}

var VIEW = "log", FILTER = { type: "", q: "", gun: "" };
var main = $("#main");

function go(v){
  VIEW = v;
  $$("nav.tabs button").forEach(function(b){ if(b.dataset.go === v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if(v === "log") viewLog(); else if(v === "history") viewHistory(); else if(v === "stats") viewStats(); else if(v === "backup") viewBackup(); else if(v === "rifle"){ if(R) viewRifle(); else viewRifles(); }
  window.scrollTo(0, 0);
}

/* ---------- Log: choose type ---------- */
function backupBanner(){
  if(!ENTRIES.length) return "";
  var due = META.changesSince >= 5 || (META.lastBackup && Date.now() - META.lastBackup > 30 * 86400000) || (!META.lastBackup && ENTRIES.length >= 3);
  if(!due) return "";
  return '<div class="banner"><b>Back up your scores.</b> They live on this phone only. If it is lost or the browser is cleared, so are they. Saving a backup file takes a few seconds.<br><button class="small" data-act="backup-now">Save a backup now</button></div>';
}
function viewLog(){
  loadLive();
  var resume = "";
  if(LIVE){
    var names = LIVE.shooters.map(function(x){ return x.name; }).join(", ");
    resume = '<div class="card"><h2>Match in progress</h2><p>' + esc(LIVE.title || "Friendly match") + ' · ' + esc(names) + '</p>' +
      '<div class="stack"><button class="good bigbtn" data-m="resume" style="min-height:64px;font-size:20px">Continue scoring</button>' +
      '<button class="danger" data-m="discard">Throw this match away</button></div></div>';
  }
  main.innerHTML = backupBanner() + resume +
    '<div class="card"><button class="bigstart" data-m="setup"><b>Start scoring</b><span>Tap a big green HIT or red MISS after each shot. One shooter or a whole club, one round or a full set of stages.</span></button></div>' +
    '<div class="card"><h3>Or log something else</h3><div class="types">' +
    ["group","points","practice"].map(function(k){ return '<button data-new="' + k + '"><b>' + esc(TYPES[k].name) + '</b><span>' + esc(TYPES[k].blurb) + '</span></button>'; }).join("") +
    '</div></div>' + '<div class="card"><button class="bigstart" data-go="rifle"><b>New rifle setup</b><span>A step-by-step checklist for building a rifle profile in Applied Ballistics (AB) Quantum.</span></button></div>' + recentCard() + installCard();
}
function recentCard(){
  if(!ENTRIES.length) return '<div class="card"><h3>Your scorebook is empty</h3><p>Everything you log is saved on this device, works with no signal at the range, and stays private. Tap a type above to log your first score.</p></div>';
  var last = ENTRIES.slice().sort(byDateDesc).slice(0, 3);
  return '<div class="card"><h3>Recent</h3>' + last.map(itemHTML).join("") + '<button class="ghost small" data-go="history">See all ' + ENTRIES.length + '</button></div>';
}
var deferredInstall = null;
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferredInstall = e; if(VIEW === "log") viewLog(); });
function installCard(){
  if(window.matchMedia && matchMedia("(display-mode: standalone)").matches || navigator.standalone) return "";
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(deferredInstall) return '<div class="card"><h3>Add to your home screen</h3><p>Open it like an app, even with no signal.</p><button data-act="install">Install My Scores</button></div>';
  if(ios) return '<div class="card"><h3>Add to your home screen</h3><p>Tap the Share button in Safari, then “Add to Home Screen.” It then opens like an app and keeps your scores safer.</p></div>';
  return "";
}

/* ====================================================================
   TAP-TO-SCORE: big HIT / MISS buttons, one or many shooters
   The match in progress is saved after every tap, so a phone that locks,
   dies or is closed by accident picks up exactly where it was.
   ==================================================================== */
var LIVE = null, SETUP = null;
function loadLive(){
  try{ LIVE = JSON.parse(localStorage.getItem("gm-live-match") || "null"); }catch(e){ LIVE = null; }
  if(LIVE && !LIVE.stages){      // a match started before stages existed
    LIVE.stages = [{ name: "", shots: LIVE.shots }]; LIVE.stage = 0;
    LIVE.log = (LIVE.log || []).map(function(i){ return { i: i, s: 0 }; });
  }
}
function saveLive(){ try{ if(LIVE) localStorage.setItem("gm-live-match", JSON.stringify(LIVE)); else localStorage.removeItem("gm-live-match"); }catch(e){} }

function newSetup(){ return { title: "", location: "", names: [""], me: 0, format: "one", shots: 10, stages: [{ name: "", shots: 5 }, { name: "", shots: 5 }], rotate: false }; }
function viewSetup(){
  if(!SETUP) SETUP = newSetup();
  var S = SETUP, multi = S.format === "stages";
  main.innerHTML = '<div class="card"><h2>Set up your match</h2>' +
    '<div class="fmt" role="group" aria-label="Match format"><button type="button" data-m="fmt" data-f="one" aria-pressed="' + !multi + '">One round<br><span class="sm" style="font-weight:500">a single string of shots</span></button>' +
    '<button type="button" data-m="fmt" data-f="stages" aria-pressed="' + multi + '">Several stages<br><span class="sm" style="font-weight:500">set it up like a director</span></button></div>' +
    '<label for="mtitle">Match name (optional)</label><input id="mtitle" value="' + esc(S.title) + '" maxlength="60" placeholder="e.g. Saturday backyard shoot-out">' +
    '<label for="mloc">Where (optional)</label><input id="mloc" value="' + esc(S.location) + '" maxlength="80" placeholder="e.g. Dave\'s back yard"></div>' +
    '<div class="card"><h2>Who is shooting?</h2><p>Add each person. Tap ★ next to your own name to have your score counted in your stats.</p>' +
    S.names.map(function(n, i){
      return '<div class="srow"><input class="nm" value="' + esc(n) + '" placeholder="Name ' + (i+1) + '" maxlength="30" aria-label="Shooter ' + (i+1) + ' name" autocomplete="off">' +
        '<button class="star" type="button" data-m="me" data-i="' + i + '" aria-pressed="' + (S.me === i) + '" aria-label="This is me">★ Me</button>' +
        (S.names.length > 1 ? '<button class="ghost small" type="button" data-m="rm" data-i="' + i + '" aria-label="Remove shooter ' + (i+1) + '" style="min-height:54px">✕</button>' : '<span></span>') + '</div>';
    }).join("") +
    '<button class="ghost" type="button" data-m="add" style="width:100%;min-height:56px">＋ Add another shooter</button></div>' +
    (multi
      ? '<div class="card"><h2>Stages</h2><p>Name each stage and set how many shots are on it. Everyone shoots stage 1, then stage 2, and so on.</p>' +
        S.stages.map(function(st, i){
          return '<div class="stagecard"><input class="sn" value="' + esc(st.name) + '" placeholder="Stage ' + (i+1) + ' name (optional)" maxlength="40" aria-label="Stage ' + (i+1) + ' name">' +
            '<div class="srow2"><span class="muted">Shots</span><div class="bigstep"><button class="ghost" type="button" data-m="ss" data-i="' + i + '" data-d="-1" aria-label="One fewer shot on stage ' + (i+1) + '">−</button><b>' + st.shots + '</b>' +
            '<button type="button" data-m="ss" data-i="' + i + '" data-d="1" aria-label="One more shot on stage ' + (i+1) + '">+</button></div>' +
            (S.stages.length > 1 ? '<button class="ghost small" type="button" data-m="rmstage" data-i="' + i + '" aria-label="Remove stage ' + (i+1) + '" style="margin-left:auto;min-height:56px">✕</button>' : "") + '</div></div>';
        }).join("") +
        '<button class="ghost" type="button" data-m="addstage" style="width:100%;min-height:56px">＋ Add a stage</button></div>'
      : '<div class="card"><h2>How many shots each?</h2><div class="bigstep"><button class="ghost" data-m="shots" data-d="-1" aria-label="One fewer shot">−</button><b id="sh-n">' + S.shots + '</b><button data-m="shots" data-d="1" aria-label="One more shot">+</button></div></div>') +
    '<div class="card"><label class="chk" style="margin-top:0"><input type="checkbox" id="rot"' + (S.rotate ? " checked" : "") + '> Take turns after every shot</label>' +
    '<p class="sm" style="margin-top:4px">Leave this off if each person shoots all of their shots in a row.</p></div>' +
    '<div class="actions"><button class="good" data-m="start" style="min-height:68px;font-size:22px">Start scoring</button><button class="ghost" data-m="home" style="min-height:68px">Back</button></div>';
  window.scrollTo(0, 0);
}
function readSetup(){
  if(!SETUP) return;
  var nm = $$(".nm"); if(nm.length) SETUP.names = nm.map(function(i){ return i.value; });
  $$(".sn").forEach(function(inp, i){ if(SETUP.stages[i]) SETUP.stages[i].name = inp.value; });
  var r = $("#rot"); if(r) SETUP.rotate = r.checked;
  var t = $("#mtitle"); if(t) SETUP.title = t.value.trim();
  var l = $("#mloc"); if(l) SETUP.location = l.value.trim();
}
function startMatch(){
  readSetup();
  var S = SETUP, names = S.names.map(function(n, i){ return (n || "").trim() || "Shooter " + (i + 1); });
  var stages = S.format === "stages"
    ? S.stages.map(function(x, i){ return { name: (x.name || "").trim() || "Stage " + (i + 1), shots: x.shots }; })
    : [{ name: "", shots: S.shots }];
  LIVE = { id: uid(), title: S.title, location: S.location, date: todayISO(), stages: stages, stage: 0, rotate: S.rotate, me: Math.min(S.me, names.length - 1),
           shooters: names.map(function(n){ return { name: n, results: [] }; }), cur: 0, log: [], done: false,
           note: stages.length > 1 ? "Stage 1: " + stages[0].name + "." : "" };
  SETUP = null; saveLive(); viewPlay();
}
function liveRemaining(i){
  var st = LIVE.stages[LIVE.stage];
  return st.shots - (LIVE.shooters[i].results.length - stageOffset(LIVE.stages, LIVE.stage));
}
function viewPlay(){
  var m = LIVE; if(!m){ go("log"); return; }
  if(m.done){ viewResults(); return; }
  var st = m.stages[m.stage], multi = m.stages.length > 1;
  var s = m.shooters[m.cur], off = stageOffset(m.stages, m.stage), n = s.results.length - off;
  var stageRes = s.results.slice(off, off + st.shots), hits = stageRes.reduce(function(a, b){ return a + b; }, 0);
  var dots = ""; for(var i = 0; i < st.shots; i++){
    var r = stageRes[i], cls = r === 1 ? "h" : r === 0 ? "m" : "";
    dots += '<span class="dot ' + cls + (i === n ? " cur" : "") + '" role="img" aria-label="Shot ' + (i+1) + ': ' + (r === 1 ? "hit" : r === 0 ? "miss" : "not yet") + '"></span>';
  }
  main.innerHTML = (m.note ? '<div class="note">' + esc(m.note) + '</div>' : "") +
    (multi ? '<div class="stagebar">Stage ' + (m.stage + 1) + ' of ' + m.stages.length + ' · ' + esc(st.name) + '</div>' : "") +
    '<div class="card"><p class="whoshoots">' + esc(s.name) + '</p><p class="shotof">Shot ' + (n + 1) + ' of ' + st.shots + ' · ' + hits + ' hit' + (hits === 1 ? "" : "s") + (multi ? " on this stage" : " so far") + '</p>' +
    '<div class="dots">' + dots + '</div>' +
    '<div class="hitmiss"><button class="hit" data-m="shot" data-v="1" aria-label="Hit"><i aria-hidden="true">✓</i>HIT</button>' +
    '<button class="miss" data-m="shot" data-v="0" aria-label="Miss"><i aria-hidden="true">✕</i>MISS</button></div>' +
    '<button class="ghost" data-m="undo" style="width:100%;min-height:60px;font-size:19px"' + (m.log.length ? "" : " disabled") + '>↶ Undo last shot</button></div>' +
    (m.shooters.length > 1 ? '<div class="card board"><h3>Scoreboard' + (multi ? " · total" : "") + '</h3>' + m.shooters.map(function(sh, i){
      return '<button class="row2' + (i === m.cur ? " now" : "") + '" data-m="pick" data-i="' + i + '"' + (liveRemaining(i) <= 0 && i !== m.cur ? " disabled" : "") + '><span>' + (i === m.cur ? "▶ " : "") + esc(sh.name) + '</span><b>' + mHits(sh) + ' / ' + sh.results.length + '</b></button>';
    }).join("") + '</div>' : "") +
    '<div class="actions"><button class="ghost" data-m="finish">Finish early</button><button class="danger" data-m="discard">Throw this match away</button></div>';
  m.note = ""; saveLive();
  window.scrollTo(0, 0);
}
function shoot(hit){
  var m = LIVE; if(!m || m.done) return;
  var from = m.cur, sh = m.shooters[from];
  if(liveRemaining(from) <= 0) return;
  sh.results.push(hit ? 1 : 0); m.log.push({ i: from, s: m.stage });
  if(navigator.vibrate) try{ navigator.vibrate(hit ? 40 : [30, 50, 30]); }catch(e){}
  if(m.rotate || liveRemaining(from) <= 0){
    var k = m.shooters.length, next = -1;
    for(var j = 1; j <= k; j++){ var idx = (from + j) % k; if(liveRemaining(idx) > 0){ next = idx; break; } }
    if(next < 0){
      // everyone has finished this stage
      if(m.stage + 1 < m.stages.length){
        m.stage++; m.cur = 0;
        m.note = "Stage " + m.stage + " finished. Now stage " + (m.stage + 1) + ": " + m.stages[m.stage].name + ". " + m.shooters[0].name + " is up.";
      } else m.done = true;
    } else {
      if(next !== from && !m.rotate) m.note = sh.name + " finished with " + stageHits(sh, m.stages, m.stage).hits + " of " + m.stages[m.stage].shots + ". Next up: " + m.shooters[next].name + ".";
      m.cur = next;
    }
  }
  saveLive(); viewPlay();
}
function undoShot(){
  var m = LIVE; if(!m || !m.log.length) return;
  var last = m.log.pop(); m.shooters[last.i].results.pop(); m.cur = last.i; m.stage = last.s; m.done = false; m.note = "Last shot removed.";

}

function syncStagesFromDOM(){

function validate(e){
  var d = e.data;
  if(e.type === "ft"){ var t = ftTotals(e); if(!t.shots) return "Add at least one stage."; }
  if(e.type === "group"){
    var pairs = [];
    d.groups.forEach(function(g, i){ var v = num(g); if(v > 0) pairs.push({ v: v, f: d.tuning ? parseFps(d.fps && d.fps[i] != null ? d.fps[i] : "") : [] }); });
    if(!pairs.length) return "Enter at least one group size.";
    if(!(num(d.distance) > 0)) return "Enter the distance.";
    d.groups = pairs.map(function(p){ return p.v; }); d.fps = d.tuning ? pairs.map(function(p){ return p.f; }) : [];
    d.distance = num(d.distance); d.shots = parseInt(d.shots, 10) || null;
  }
  if(e.type === "points"){
    if(num(d.score) == null) return "Enter your score.";
    d.score = num(d.score); d.max = num(d.max); d.x = parseInt(d.x, 10) || 0;
  }
  if(e.type === "practice"){
    d.rounds = parseInt(d.rounds, 10) || 0; d.minutes = parseInt(d.minutes, 10) || 0;
    if(!d.rounds && !e.notes) return "Add the rounds fired or a note.";
  }
  return null;
}

/* ---------- Stats ---------- */
function spark(values, fmt){
  if(values.length < 2) return "";
  var w = 300, h = 70, pad = 6, min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  if(max === min){ max += 1; min -= 1; }
  var pts = values.map(function(v, i){ return [pad + i * (w - 2*pad) / (values.length - 1), h - pad - (v - min) / (max - min) * (h - 2*pad)]; });
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Trend over your last ' + values.length + ' entries"><polyline fill="none" stroke="#1f3b5c" stroke-width="2.5" stroke-linejoin="round" points="' +
    pts.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + '"/>' +
    pts.map(function(p, i){ return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (i === pts.length-1 ? 4 : 2.5) + '" fill="' + (i === pts.length-1 ? "#b71d1c" : "#1f3b5c") + '"/>'; }).join("") + '</svg>';
}

      '<div class="tune"><table><tr><th>Date</th><th>Avg group</th><th>Spread</th><th>Avg FPS</th></tr>' + rows.slice().reverse().map(function(r){
        var u = r.e.data.sizeUnit === "moa" ? "MOA" : r.e.data.sizeUnit;
        return '<tr><td>' + esc(fmtDate(r.e.date).replace(/, \d{4}$/, "")) + '</td><td>' + r2(r.t.mean) + ' ' + u + '</td><td>' + (r.t.n > 1 ? r2(r.t.sd) : "—") + '</td><td>' + (r.t.fpsMean != null ? Math.round(r.t.fpsMean) : "—") + '</td></tr>';
      }).join("") + '</table></div></div>';

function restore(file){
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var j = JSON.parse(rd.result), list = Array.isArray(j) ? j : (j.entries || []), rl = (!Array.isArray(j) && Array.isArray(j.rifles)) ? j.rifles : [];
      if(!Array.isArray(list)) throw 0;
      var added = 0, updated = 0, skipped = 0;
      list.forEach(function(x){
        if(!validEntry(x)){ skipped++; return; }
        var cur = ENTRIES.find(function(y){ return y.id === x.id; });
        if(!cur){ added++; saveEntry(x); }
        else if((x.updated || x.created || 0) > (cur.updated || cur.created || 0)){ updated++; saveEntry(x); }
      });
      rl.forEach(function(x){ if(!validRifle(x)) return; var cur = RIFLES.find(function(y){ return y.id === x.id; }); if(!cur){ added++; saveRifle(x); } else if((x.updated || 0) > (cur.updated || 0)){ updated++; saveRifle(x); } });
      META.changesSince = 0; saveMeta();
      toast("Restored: " + added + " added, " + updated + " updated" + (skipped ? ", " + skipped + " skipped" : "") + ".");
      viewBackup();
    }catch(e){ toast("That doesn't look like a My Scores backup file."); }
  };
  rd.readAsText(file);
}

/* ====================================================================
   NEW RIFLE SETUP CHECKLIST
   Seven short steps. Your gear picks the route, and only the calibration your
   route needs is shown. Everything saves on this device as you type, and the
   Review sheet compiles it for typing into AB (Applied Ballistics) Quantum.
   ==================================================================== */
var RIFLES = [], R = null, RSTEP = "gear", saveT = null;

/* Every acronym is written out in full wherever it appears. */
var ACR = {
  AB:  ["AB", "Applied Ballistics", "The company behind the Quantum ballistic solver app."],
  MV:  ["MV", "Muzzle Velocity", "The speed of the projectile as it leaves the barrel, usually in feet per second."],
  CDM: ["CDM", "Custom Drag Model", "A drag profile for one specific projectile, measured with Doppler radar."],
  CDF: ["CDF", "Custom Drag Factor", "A percentage that scales the drag model so predicted drop matches what you actually see, while your measured MV stays as it is."],
  DSF: ["DSF", "Drop Scale Factor", "A correction that scales predicted drop. It can be calibrated separately at several distances, mainly for the transonic and subsonic parts of the flight."],
  G7:  ["G7", "G7 standard drag model", "A reference drag curve based on a long, boat-tail projectile."],
  G1:  ["G1", "G1 standard drag model", "A reference drag curve based on a flat-base projectile."],
  MIL: ["MIL", "milliradian", "An angle unit. One MIL is 3.6 inches at 100 yards."],
  MOA: ["MOA", "Minute of Angle", "An angle unit. One MOA is about 1.047 inches at 100 yards."],
  ES:  ["ES", "Extreme Spread", "The fastest shot minus the slowest shot."],
  SD:  ["SD", "Standard Deviation", "How much shot speeds vary from the average. Lower means steadier."],
  FPS: ["FPS", "feet per second", "The unit for speed."],
  SSF: ["SSF", "Sight Scale Factor", "How accurately the scope moves the reticle per click. For example, you dial 10.0 MIL but the reticle only moves 9.8 MIL."],
  BC:  ["BC", "Ballistic Coefficient", "How well a projectile resists air drag. A higher number means less drag."]
};
function A(k){ return ACR[k][0] + " (" + ACR[k][1] + ")"; }

var STEPS = [
  { id: "gear",      title: "Your gear" },
  { id: "setup",     title: "Rifle and zero" },
  { id: "mv",        title: "Muzzle velocity" },
  { id: "tall",      title: "Tall-target test" },
  { id: "check",     title: "Check drop at distance" },
  { id: "dsf",       title: "Drop Scale Factor (optional)" },
  { id: "review",    title: "Review sheet" }
];
var STEP_BY = {}; STEPS.forEach(function(s){ STEP_BY[s.id] = s; });
function visibleSteps(){ return STEPS; }
function counted(){ return STEPS.filter(function(s){ return s.id !== "review"; }).map(function(s){ return s.id; }); }
function stepTitle(id, r){
  var k = route(r).key;
  if(id === "check") return k === "cdf" ? "Custom Drag Factor check and correction" : k === "mv" ? "Check drop and true muzzle velocity" : "Check drop at distance";
  if(id === "dsf") return k === "dsf" ? "Drop Scale Factor" : "Drop Scale Factor (optional)";
  return STEP_BY[id].title;
}

var TB = {
  mv:   { title: "Shot", cols: [["v", "Velocity (fps)"], ["at", "Ammo temp (°F)"]], start: 5 },
  base: { title: "Range", cols: [["rng", "Range"], ["q", "Quantum elevation"], ["a", "Actual TRUE drop"]], start: 3 },
  dsf:  { title: "Point", cols: [["rng", "Range"], ["p", "Prediction"], ["t", "TRUE drop"], ["n", "Drop Scale Factor"]], start: 2 },
  mvt:  { title: "Point", cols: [["t", "Ammo temp (°F)"], ["v", "Muzzle velocity (fps)"]], start: 3 }
};
function emptyRow(name){ var o = {}; TB[name].cols.forEach(function(c){ o[c[0]] = ""; }); return o; }
function newRifle(){
  var tb = {}; Object.keys(TB).forEach(function(k){ tb[k] = []; for(var i = 0; i < TB[k].start; i++) tb[k].push(emptyRow(k)); });
  return { id: uid(), created: Date.now(), updated: Date.now(), done: {},
    d: { chrono: "", tracking: "", elite: "", augment: "no", speed: "", drag: "G7", twistDir: "Right", elev: "MIL", zeroRange: "50", zeroUnit: "yd", sightScale: "1.000", date: todayISO() },
    tb: tb, tall: [] };
}
function fixRifle(r){
  Object.keys(TB).forEach(function(k){ if(!r.tb[k]){ r.tb[k] = []; for(var i = 0; i < TB[k].start; i++) r.tb[k].push(emptyRow(k)); } });
  if(!r.tall) r.tall = []; if(!r.done) r.done = {}; return r;
}
function stepsDone(r){ return counted().filter(function(id){ return r.done["step:" + id]; }).length; }
function firstOpen(r){ var v = counted(); for(var i = 0; i < v.length; i++){ if(v[i] === "gear" ? !(r.d.chrono && r.d.tracking) : !r.done["step:" + v[i]]) return v[i]; } return "review"; }
function rName(r){ return r.d.name || r.d.rifle || "Unnamed rifle"; }
function unitName(){ return R.d.elev === "MOA" ? "MOA" : "MIL"; }
function uLab(){ return R.d.elev === "MOA" ? A("MOA") : A("MIL"); }

/* Which calibration fits the equipment, from Applied Ballistics' Custom Drag Factor page
   and Bryan Litz's paper "The Evolution of Ballistic Calibration". */
function route(r){
  var d = r.d, out = { key: "ask", why: [], cautions: [], fallback: false };
  if(!d.chrono || !d.tracking) return out;
  var verified = d.tracking !== "cant", doppler = d.chrono === "doppler", cdm = d.drag === "CDM", elite = d.elite === "yes";
  var low = d.speed === "sub" || (num(d.mv) != null && num(d.mv) < 1340);
  if(!verified){
    out.key = "dsf";
    out.why.push("You can't verify your scope tracking on a tall target. For that situation Applied Ballistics points to " + A("DSF") + ", which only scales the drop and leaves muzzle velocity and drag alone.");
  } else if(!doppler){
    out.key = "mv";
    out.why.push(d.chrono === "none"
      ? "You have no chronograph. With scope tracking verified, muzzle velocity is the most likely cause of a big trajectory error, so Applied Ballistics recommends " + A("MV") + " truing."
      : "You don't have an accurate Doppler chronograph. With scope tracking verified, Applied Ballistics recommends " + A("MV") + " truing, which also absorbs small chronograph errors.");
  } else if(cdm && elite){
    out.key = "cdf";
    out.why.push("You have an accurate Doppler chronograph, verified scope tracking and a " + A("CDM") + ". That is the setup " + A("CDF") + " is made for: it scales drag to match what you see and keeps your measured " + A("MV") + " unchanged.");
  } else {
    out.key = "dsf"; out.fallback = true;
    out.why.push("An accurate chronograph and verified tracking would normally point to " + A("CDF") + ", but " + A("CDF") + " needs a " + A("CDM") + " and Applied Ballistics Elite. The guides don't name a method for this exact mix. " + A("DSF") + " is the option that leaves your measured " + A("MV") + " alone, so it is suggested here. Confirm with Applied Ballistics if you are unsure.");
    if(!cdm) out.cautions.push("You chose " + (d.drag === "G1" ? A("G1") : A("G7")) + ", not a " + A("CDM") + ". " + A("CDF") + " needs a " + A("CDM") + " from the Applied Ballistics custom library.");
    if(!elite) out.cautions.push(d.elite === "unsure" ? "Check whether you have Applied Ballistics Elite. " + A("CDF") + " is an Elite feature (first released in Applied Ballistics Quantum 3.2). If you do, change the answer above." : A("CDF") + " is an Applied Ballistics Elite feature, and you answered no.");
  }
  if(out.key === "mv" && low){
    out.key = "dsf"; out.fallback = false;
    out.why = ["Your ammunition is subsonic or transonic, as most .22 rimfire is. " + A("MV") + " truing is meant for a supersonic range, which this flight does not have. Applied Ballistics points to " + A("DSF") + " for the transonic and subsonic part of the flight, so that is the route here. This is a judgement from the guides, which do not cover rimfire directly."];
  } else if(out.key === "cdf" && low){
    out.cautions.push("Your ammunition is subsonic or transonic. " + A("CDF") + " applies from the muzzle to the target, and you can add " + A("DSF") + " points afterward for the transonic and subsonic part of the flight.");
  }
  if(d.tracking === "planned") out.cautions.push("Do the tall-target test before any calibration. Everything after it depends on it.");
  if(d.augment === "yes") out.cautions.push("An adjustable base, prism or periscope can add tracking error. Include it in the tall-target test. " + A("DSF") + " is the usual fix for what is left.");
  if(d.chrono === "other") out.cautions.push("Older chronographs can have measurement error, so treat your " + A("MV") + " as an indication, not an exact number.");
  return out;
}

/* 4 tall target */
function newTall(){ return { range: "100", rUnit: "yd", dial: "10", dUnit: R.d.elev === "MOA" ? "MOA" : "MIL", meas: "", mUnit: R.d.zeroUnit === "m" ? "cm" : "in" }; }
function tallConst(t){
  if(t.rUnit !== "m") return { k: t.dUnit === "MOA" ? 0.010472 : 0.036, u: "in" };
  return { k: t.dUnit === "MOA" ? 0.029089 : 0.100, u: "cm" };
}
function tallCalc(t){
  var r = num(t.range), d = num(t.dial), m = num(t.meas);
  if(!(r > 0) || !(d > 0)) return null;
  var c = tallConst(t), exp = d * r * c.k;
  if(!(m > 0)) return { exp: exp, unit: c.u };
  var mm = t.mUnit === "cm" ? m * 10 : t.mUnit === "mm" ? m : m * 25.4;
  var meas = c.u === "in" ? mm / 25.4 : mm / 10;
  return { exp: exp, unit: c.u, meas: meas, scale: exp / meas, pct: (meas / exp - 1) * 100, actual: d * meas / exp, diff: meas - exp, dUnit: t.dUnit, dial: d };
}
function tallOut(t){
  var c = tallCalc(t);
  if(!c) return '<p class="sm">Enter the range and the amount you dialed to see the expected shift.</p>';
  var h = '<dl class="kv"><dt>Expected shift</dt><dd><b>' + r2(c.exp) + ' ' + c.unit + '</b></dd>';
  if(c.meas == null) return h + '</dl><p class="sm">Now enter the shift you measured from group A to group B.</p>';
  var ok = Math.abs(c.pct) < 0.5;
  var verdict = ok ? "Tracks true" : c.pct > 0 ? "Over-travel: +" + r2(c.pct) + "%" : "Under-travel: " + r2(c.pct) + "%";
  var why = ok ? "The reticle moved what the turret said, within half a percent." : c.pct > 0 ? "The point of impact moved " + r2(c.pct) + "% MORE than the amount you dialed." : "The point of impact moved " + r2(Math.abs(c.pct)) + "% LESS than the amount you dialed.";
  return '<div class="tt ' + (ok ? "ok" : "warn") + '"><div class="ttv">' + verdict + '</div><p style="margin:2px 0 8px;color:inherit">' + why + '</p>' + h +
    '<dt>Actual shift</dt><dd>' + r2(c.meas) + ' ' + c.unit + '</dd><dt>Difference</dt><dd>' + (c.diff >= 0 ? "+" : "−") + r2(Math.abs(c.diff)) + ' ' + c.unit + '</dd>' +
    '<dt>In real turns</dt><dd>You dialed ' + r2(c.dial) + ' ' + c.dUnit + ' and it moved ' + r2(c.actual) + ' ' + c.dUnit + '</dd>' +
    '<dt>Sight scale</dt><dd><b>' + c.scale.toFixed(4) + '</b> (expected ÷ measured)</dd></dl></div>';
}
function tallValid(){ return R.tall.map(tallCalc).filter(function(c){ return c && c.scale; }); }
function tallScale(){ var v = tallValid(); return v.length ? mean(v.map(function(c){ return c.scale; })) : null; }
function tallSummary(){
  var v = tallValid();
  if(!v.length) return '<p class="sm">Your result shows here once the test has all its numbers.</p>';
  var s = mean(v.map(function(c){ return c.scale; })), pc = (1 / s - 1) * 100, ok = Math.abs(pc) < 0.5;
  return '<div class="tt ' + (ok ? "ok" : "warn") + '"><div class="ttv">' + (ok ? "Your scope tracks true" : pc > 0 ? "Your scope over-travels by " + r2(pc) + "%" : "Your scope under-travels by " + r2(Math.abs(pc)) + "%") + '</div>' +
    '<p style="margin:2px 0 8px;color:inherit">' + v.length + ' test' + (v.length === 1 ? "" : "s") + ' combined. Sight scale <b>' + s.toFixed(4) + '</b>.</p>' +
    (ok ? '<p style="margin:0;color:inherit">Within half a percent, so leave the sight scale at 1.000.</p>' :
      '<button class="ghost" type="button" data-r="usescale" data-v="' + s.toFixed(4) + '">Save ' + s.toFixed(4) + ' as my sight scale</button>') + '</div>';
}
function tallCard(t, i){
  var sUnits = function(k, opts){ return '<select data-t="' + i + '.' + k + '" aria-label="Unit">' + opts.map(function(o){ return '<option value="' + o[0] + '"' + (t[k] === o[0] ? " selected" : "") + '>' + o[1] + '</option>'; }).join("") + '</select>'; };
  return '<div class="stagecard">' + (R.tall.length > 1 ? '<h3 style="margin:0 0 4px">Test ' + (i + 1) + '</h3>' : "") +
    '<label for="t' + i + 'a">Exact range to the target</label><div class="row"><input id="t' + i + 'a" data-t="' + i + '.range" inputmode="decimal" value="' + esc(t.range) + '">' + sUnits("rUnit", [["yd", "yards"], ["m", "meters"]]) + '</div>' +
    '<label for="t' + i + 'b">How much you dialed up</label><div class="row"><input id="t' + i + 'b" data-t="' + i + '.dial" inputmode="decimal" value="' + esc(t.dial) + '">' + sUnits("dUnit", [["MIL", "MIL (milliradian)"], ["MOA", "MOA (Minute of Angle)"]]) + '</div>' +
    '<label for="t' + i + 'c">Measured distance between the two groups (center to center)</label><div class="row"><input id="t' + i + 'c" data-t="' + i + '.meas" inputmode="decimal" value="' + esc(t.meas) + '">' + sUnits("mUnit", [["in", "inches"], ["cm", "centimeters"], ["mm", "millimeters"]]) + '</div>' +
    '<div id="tout-' + i + '" style="margin-top:12px">' + tallOut(t) + '</div>' +
    (R.tall.length > 1 ? '<button class="danger small" type="button" data-r="rmtall" data-i="' + i + '" style="margin-top:10px">Remove this test</button>' : "") + '</div>';
}
function bodyTall(){
  if(!R.tall.length) R.tall.push(newTall());
  var tr = R.d.tracking;
  return '<p>This checks that the turret moves the reticle as far as it says. For example, you dial 10.0 ' + A("MIL") + ' and the reticle only moves 9.8 ' + A("MIL") + '. Do it before any calibration.</p>' +
    (tr === "cant" ? hold("You said you can't verify scope tracking, so your route is " + A("DSF") + ". Fill this in only if you can.") : "") +
    (R.d.augment === "yes" ? hold("Include your adjustable base, prism or periscope in this test. They are a common source of tracking error.") : "") +
    '<ol class="steps"><li>Use a tall target with a plumb vertical line, a level rifle and a measured range.</li><li>Fire group A, dial up a known amount, then fire group B at the same aim point.</li><li>Measure A to B, then dial back and fire group C to confirm you return to zero.</li></ol>' +

/* 5 check drop, then the route's main correction */
function bodyCheck(){

    help("Elevation in " + uLab() + ".") + tbHTML("base", "a distance") +
    '<p class="sm" style="margin-top:10px"><b>If the numbers agree, you are finished.</b> How much error is normal? In Applied Ballistics\' data for one 6mm 105 grain bullet, rifle-to-rifle drag variation moved drop at 1000 yards by about 3.3 inches (1 click) for most samples and 6.7 inches (2 clicks) for 95%. Much larger error probably is not drag.</p>';

    fld("cdfRange", "Calibration range", { mode: "decimal" }) + fld("cdfPred", "Quantum prediction (" + u + ")", { mode: "decimal" }) + fld("cdfTrue", "Observed TRUE drop (" + u + ")", { mode: "decimal" }) +

  else if(k === "mv") h += '<p>' + A("MV") + ' truing adjusts the starting velocity so predicted drop matches the drop you observe at a supersonic range. It can only be done once and applies from the muzzle to the target. Enter the full observed TRUE drop in Quantum\'s calibration, then record what it gives you.</p>' +
    fld("tvRange", "Calibration range", { mode: "decimal" }) + fld("tvPred", "Quantum prediction (" + u + ")", { mode: "decimal" }) + fld("tvTrue", "Observed TRUE drop (" + u + ")", { mode: "decimal" }) +

/* 6 Drop Scale Factor, piecewise */
function bodyDSF(){

    '<p class="sm">Unlike ' + A("MV") + ' truing and ' + A("CDF") + ', you can add ' + A("DSF") + ' points at several ranges, one beyond the other, after the first correction. Enter the TRUE drop and check each point before adding another.</p>' +
    tbHTML("dsf", "a point") +

/* review sheet */
function val(k){ var v = R.d[k]; return v == null || String(v).trim() === "" ? "" : String(v).trim(); }
function tbRows(name, fmt){
  var t = R.tb[name] || [];

}
function compile(){
  var d = R.d, u = unitName(), g = [], ms = mvStats(), ts = tallScale(), ro = route(R);
  g.push({ title: "Your gear and route", rows: [
    ["Chronograph", { none: "None", other: "Older, or unsure how accurate", doppler: "Accurate Doppler chronograph" }[d.chrono] || ""],
    ["Scope tracking", { yes: "Already verified", planned: "Tall-target test planned", cant: "Cannot verify" }[d.tracking] || ""],
    ["Ammunition speed", { super: "Mostly supersonic", sub: "Subsonic or transonic" }[d.speed] || ""],
    ["Applied Ballistics Elite", { yes: "Yes", no: "No", unsure: "Not sure" }[d.elite] || ""],
    ["Adjustable base, prism or periscope", d.augment === "yes" ? "Yes" : "No"],
    ["Calibration method", ro.key === "ask" ? "" : routeTitle(ro.key)]
  ]});
  g.push({ title: "Rifle and zero", rows: [
    ["Rifle / profile name", val("name")], ["Ammo / lot", val("ammo")], ["Optic / model", val("optic")],
    ["Exact " + A("AB") + " projectile", val("projectile")], ["Drag model", d.drag === "CDM" ? A("CDM") : d.drag === "G1" ? A("G1") : A("G7")],
    ["Projectile weight", val("weight") && val("weight") + " gr"], ["Twist rate / direction", val("twist") && val("twist") + " " + (d.twistDir === "Left" ? "left" : "right")],
    ["Sight height", val("sightHeight") && val("sightHeight") + " in"], ["Zero range", val("zeroRange") && val("zeroRange") + (d.zeroUnit === "m" ? " m" : " yd")],
    ["Elevation unit", d.elev === "MOA" ? A("MOA") : A("MIL")], val("zeroOffset") ? ["Zero offset", val("zeroOffset")] : null
  ]});
  var mvRows = [["Base " + A("MV"), val("mv") && val("mv") + " fps"]];
  if(ms) mvRows.push(["Shots recorded", ms.n + " shots, average " + Math.round(ms.avg) + ", " + A("ES") + " " + Math.round(ms.es) + ", " + A("SD") + " " + r2(ms.sd)]);
  if(val("mvTemp")) mvRows.push(["Ammunition temperature", val("mvTemp") + " °F"]);
  tbRows("mvt", function(r){ return [(r.t || "?") + " °F", (r.v || "?") + " fps"]; }).forEach(function(x){ mvRows.push(x); });
  g.push({ title: "Muzzle velocity", rows: mvRows });
  var nt = tallValid().length;
  g.push({ title: "Scope tracking", rows: [["Sight scale to enter", val("sightScale") || "1.000"]].concat(ts != null ? [["Tall-target result", (Math.abs((1 / ts - 1) * 100) < 0.5 ? "Tracks true" : (1 / ts > 1 ? "Over-travel +" : "Under-travel ") + r2(Math.abs((1 / ts - 1) * 100)) + "%") + " (" + nt + " test" + (nt === 1 ? "" : "s") + ")"]] : []) });
  g.push({ title: "Drop check (calibration off)", rows: tbRows("base", function(r){ var q = num(r.q), a = num(r.a); return [(r.rng || "?") + " range", "predicted " + (r.q || "?") + ", actual TRUE drop " + (r.a || "?") + " " + u + (q != null && a != null ? " (" + (a - q >= 0 ? "+" : "−") + r2(Math.abs(a - q)) + ")" : "")]; }) });
  var cal = [];
  if(R.done["c:nocal"]) cal.push(["Calibration", "None needed, predictions agree"]);
  else {
    if(ro.key === "mv") cal.push(["Calibration range", val("tvRange")], ["Quantum prediction", val("tvPred") && val("tvPred") + " " + u], ["Observed TRUE drop", val("tvTrue") && val("tvTrue") + " " + u], [A("MV") + " after truing", val("tvMV") && val("tvMV") + " fps"]);
    if(ro.key === "cdf") cal.push(["Calibration range", val("cdfRange")], ["Quantum prediction", val("cdfPred") && val("cdfPred") + " " + u], ["Observed TRUE drop", val("cdfTrue") && val("cdfTrue") + " " + u], [A("CDF") + " or OFF", val("cdf")]);
  }
  tbRows("dsf", function(r){ return [A("DSF") + " at " + (r.rng || "?") + " range", "prediction " + (r.p || "?") + ", TRUE drop " + (r.t || "?") + (r.n ? ", " + A("DSF") + " " + r.n : "")]; }).forEach(function(x){ cal.push(x); });
  if(ro.key === "ask" && !cal.length) cal.push(["Calibration", ""]);
  g.push({ title: "Calibration", rows: cal });
  return g.map(function(x){ x.rows = x.rows.filter(Boolean); return x; }).filter(function(x){ return x.rows.length; });
}
function reviewText(){
  var out = ["New rifle setup: " + rName(R), ""];
  compile().forEach(function(grp){ out.push(grp.title.toUpperCase()); grp.rows.forEach(function(r){ out.push("  " + r[0] + ": " + (r[1] || "(not filled in)")); }); out.push(""); });
  out.push("For " + A("AB") + " Quantum. Made with GunMatches.com My Scores.");
  return out.join("\n");
}

/* ---------- live updates and events ---------- */
function rifleInput(t, type){
  if(!R) return;
  if(t.dataset.k){
    R.d[t.dataset.k] = t.value; touchR();
    if(t.dataset.re && type === "change"){ var y = window.scrollY; viewRifle(); window.scrollTo(0, y); }
    return;
  }
  if(t.dataset.c){ R.done[t.dataset.c] = t.checked; touchR(); return; }
  if(t.dataset.tb){
    var p = t.dataset.tb.split("."), n = p[0], i = Number(p[1]), c = p[2];
    R.tb[n][i][c] = t.value; touchR();
    var cs = $("#tbc-" + n + i); if(cs) cs.textContent = tbCalc(n, R.tb[n][i]);
    if(n === "mv"){ var o = $("#mvout"); if(o) o.innerHTML = mvOut(); }
    return;
  }
  if(t.dataset.t){
    var q = t.dataset.t.split("."), j = Number(q[0]);
    R.tall[j][q[1]] = t.value; touchR();
    var to = $("#tout-" + j); if(to) to.innerHTML = tallOut(R.tall[j]);
    var tsum = $("#tallsum"); if(tsum) tsum.innerHTML = tallSummary();
  }
}
function rifleAction(t){
  var a = t.dataset.r;
  if(t.dataset.tg){ if(!R) return; var tk = t.dataset.tg; if(tk === "shots") R.d.shots = shotsOpen() ? "0" : "1"; else R.d[tk] = R.d[tk] === "1" ? "0" : "1"; touchR(); viewRifleStep(); return; }
  if(a === "new"){ R = newRifle(); RSTEP = "gear"; saveRifle(R); viewRifle(); window.scrollTo(0, 0); return; }
  if(a === "open"){ R = RIFLES.find(function(x){ return x.id === t.dataset.id; }); if(R){ fixRifle(R); RSTEP = firstOpen(R); viewRifle(); window.scrollTo(0, 0); } return; }
  if(a === "back"){ flushR().then(function(){ viewRifles(); window.scrollTo(0, 0); }); return; }
  if(!R) return;
  if(a === "step"){ RSTEP = t.dataset.s; flushR(); viewRifle(); window.scrollTo(0, 0); return; }
  if(a === "next"){
    R.done["step:" + RSTEP] = true; touchR();
    var vis = visibleSteps(R), i = vis.findIndex(function(s){ return s.id === RSTEP; });
    RSTEP = vis[Math.min(i + 1, vis.length - 1)].id; flushR(); viewRifle(); window.scrollTo(0, 0); return;
  }
  if(a === "usemv"){ R.d.mv = t.dataset.v; touchR(); var f = $("#k-mv"); if(f) f.value = t.dataset.v; toast("Base muzzle velocity set to " + t.dataset.v + "."); return; }
  if(a === "usescale"){ R.d.sightScale = t.dataset.v; touchR(); var f2 = $("#k-sightScale"); if(f2) f2.value = t.dataset.v; toast("Sight scale saved: " + t.dataset.v); return; }
  if(a === "addtall"){ R.tall.push(newTall()); touchR(); viewRifleStep(); return; }
  if(a === "rmtall"){ R.tall.splice(Number(t.dataset.i), 1); touchR(); viewRifleStep(); return; }
  if(a === "addrow"){ R.tb[t.dataset.n].push(emptyRow(t.dataset.n)); touchR(); viewRifleStep(); return; }
  if(a === "rmrow"){ R.tb[t.dataset.n].splice(Number(t.dataset.i), 1); touchR(); viewRifleStep(); return; }
  if(a === "copy"){
    var txt = reviewText();
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ toast("Copied. Paste it into a note or message."); }, function(){ window.prompt("Copy this:", txt); });
    else window.prompt("Copy this:", txt);
    return;
  }
  if(a === "print"){ printSheet(); return; }
  if(a === "delete"){
    if(!confirm("Delete this rifle and everything you entered for it? This can't be undone unless you have a backup.")) return;
    var id = R.id; clearTimeout(saveT); R = null; removeRifle(id).then(function(){ toast("Deleted."); viewRifles(); });
  }
}

   EVENTS
   ==================================================================== */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("button, [data-go]"); if(!t) return;
  if(t.dataset.go){ closeSheet(); go(t.dataset.go); return; }
  if(t.dataset.r || t.dataset.tg){ rifleAction(t); return; }
  if(t.dataset.new){ startEntry(t.dataset.new); return; }
  if(t.dataset.open){ detail(t.dataset.open); return; }
  if(t.dataset.edit){ var e = ENTRIES.find(function(x){ return x.id === t.dataset.edit; }); closeSheet(); if(e) startEntry(e.type, e); return; }
  if(t.dataset.share){
    var s = ENTRIES.find(function(x){ return x.id === t.dataset.share; }); if(!s) return;
    var text = shareText(s);
    if(navigator.share) navigator.share({ title: "My score", text: text }).catch(function(){});
    else if(navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ toast("Copied to your clipboard."); });
    return;
  }
  if(t.dataset.del){
    if(!confirm("Delete this entry? This can't be undone unless you have a backup.")) return;
    removeEntry(t.dataset.del).then(function(){ closeSheet(); toast("Deleted."); go(VIEW === "log" ? "log" : "history"); });
    return;
  }
  if(t.dataset.ftype !== undefined){ FILTER.type = t.dataset.ftype; viewHistory(); return; }
  if(t.dataset.hit){
    var row = t.closest(".stage"), inp = $('[data-f="hits"]', row), sh = $('[data-f="shots"]', row);
    var v = (parseInt(inp.value, 10) || 0) + Number(t.dataset.hit), cap = parseInt(sh.value, 10) || 1;
    inp.value = Math.max(0, Math.min(cap, v)); syncStagesFromDOM(); return;
  }
  if(t.dataset.rmgroup !== undefined){ readForm(); DRAFT.data.groups.splice(Number(t.dataset.rmgroup), 1); DRAFT.data.fps.splice(Number(t.dataset.rmgroup), 1); if(!DRAFT.data.groups.length){ DRAFT.data.groups = [""]; DRAFT.data.fps = [""]; } $("#typeform").innerHTML = typeForm(DRAFT); return; }
  if(t.dataset.match) return;
  if(t.dataset.m){
    var mm = t.dataset.m, ix = Number(t.dataset.i);
    switch(mm){
      case "setup": SETUP = null; viewSetup(); break;
      case "home": SETUP = null; go("log"); break;
      case "add": readSetup(); if(SETUP.names.length < 12){ SETUP.names.push(""); viewSetup(); var all = $$(".nm"); all[all.length - 1].focus(); } else toast("That's the most we can fit: 12 shooters."); break;
      case "rm": readSetup(); SETUP.names.splice(ix, 1); if(SETUP.me >= SETUP.names.length) SETUP.me = 0; else if(SETUP.me > ix) SETUP.me--; viewSetup(); break;
      case "me": readSetup(); SETUP.me = ix; viewSetup(); break;
      case "shots": readSetup(); SETUP.shots = Math.max(1, Math.min(100, SETUP.shots + Number(t.dataset.d))); $("#sh-n").textContent = SETUP.shots; break;
      case "fmt": readSetup(); SETUP.format = t.dataset.f; viewSetup(); break;
      case "addstage": readSetup(); if(SETUP.stages.length < 20){ var ls = SETUP.stages[SETUP.stages.length - 1]; SETUP.stages.push({ name: "", shots: ls ? ls.shots : 5 }); viewSetup(); var sn = $$(".sn"); sn[sn.length - 1].focus(); } else toast("That's the most we can fit: 20 stages."); break;
      case "rmstage": readSetup(); if(SETUP.stages.length > 1) SETUP.stages.splice(ix, 1); viewSetup(); break;
      case "ss": readSetup(); SETUP.stages[ix].shots = Math.max(1, Math.min(50, SETUP.stages[ix].shots + Number(t.dataset.d))); viewSetup(); break;
      case "start": startMatch(); break;
      case "resume": loadLive(); viewPlay(); break;
      case "shot": shoot(t.dataset.v === "1"); break;
      case "undo": undoShot(); break;
      case "pick": if(LIVE && liveRemaining(ix) > 0){ LIVE.cur = ix; saveLive(); viewPlay(); } break;
      case "finish": if(confirm("Finish now? Shots not taken yet won't count.")){ LIVE.done = true; saveLive(); viewResults(); } break;
      case "discard": if(confirm("Throw this match away? The scores will be lost.")){ LIVE = null; saveLive(); SETUP = null; go("log"); } break;
      case "share-live":
        var txt = liveShareText(LIVE);
        if(navigator.share) navigator.share({ title: "Match results", text: txt }).catch(function(){});
        else if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ toast("Copied to your clipboard."); });
        break;
      case "save": t.disabled = true; saveMatch(); break;
    }
    return;
  }
  switch(t.dataset.act){
    case "close": closeSheet(); break;
    case "cancel": go("log"); break;
    case "pick-match": pickMatch(); break;
    case "add-stage": syncStagesFromDOM(); var last = DRAFT.data.stages[DRAFT.data.stages.length - 1]; DRAFT.data.stages.push({ name: "", hits: 0, shots: last ? last.shots : 4 }); $("#typeform").innerHTML = typeForm(DRAFT); break;
    case "rm-stage": syncStagesFromDOM(); if(DRAFT.data.stages.length > 1) DRAFT.data.stages.pop(); $("#typeform").innerHTML = typeForm(DRAFT); break;
    case "add-group": readForm(); DRAFT.data.groups.push(""); DRAFT.data.fps.push(""); $("#typeform").innerHTML = typeForm(DRAFT); var gi = $$("#groups input[data-g]"); if(gi.length) gi[gi.length - 1].focus(); break;
    case "save":
      if(DRAFT.type === "ft") syncStagesFromDOM();
      readForm();
      var err = validate(DRAFT);
      if(err){ toast(err); break; }
      DRAFT.updated = Date.now();
      var editing = ENTRIES.some(function(x){ return x.id === DRAFT.id; });
      t.disabled = true;
      saveEntry(DRAFT).then(function(){ toast(editing ? "Changes saved." : "Score saved."); FILTER = { type: "", q: "", gun: "" }; go("history");
        if(!META.lastBackup && ENTRIES.length === 3) setTimeout(function(){ toast("Tip: save a backup file from the Backup tab."); }, 2800);
        if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
      });
      break;
    case "backup-now": backupFile(); toast("Backup saved to your downloads."); if(VIEW === "backup") viewBackup(); else if(VIEW === "log") viewLog(); break;
    case "csv": exportCSV(); break;
    case "restore": $("#rfile").click(); break;
    case "install": if(deferredInstall){ deferredInstall.prompt(); deferredInstall = null; } break;
  }
});
